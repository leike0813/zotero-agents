<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script src="../shared/theme.js"></script>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/icons.css?ui=20260614-icons-v1" />
    <link
      rel="stylesheet"
      href="../shared/assistant/assistant-panel-shared.css"
    />
    <link
      rel="stylesheet"
      href="../shared/assistant/assistant-workspace-acp-child.css"
    />
    <link rel="stylesheet" href="../shared/vendor/katex/katex.min.css" />
  </head>
  <body data-source="acp-chat">
    <main
      class="assistant-workspace-acp-shell asst-panel-shell"
      data-role="root"
    >
      <header class="asst-shell-toolbar" data-role="toolbar"></header>
      <section class="asst-banner" data-role="banner"></section>
      <section
        class="assistant-message-counter-region hidden"
        data-role="message-counts"
      ></section>
      <section
        class="asst-panel-drawer-overlay hidden"
        data-role="context-drawer"
      ></section>
      <section class="asst-panel-main" data-role="main">
        <section class="asst-conversation-surface" data-role="conversation">
          <section
            class="asst-empty-state hidden"
            data-role="empty"
            aria-live="polite"
          ></section>
          <section class="plain-mode" data-role="transcript"></section>
          <div
            class="asst-conversation-overlay-menu"
            role="group"
            aria-label=""
          >
            <button
              class="asst-button-compact"
              type="button"
              data-assistant-view-mode="plain"
              aria-label=""
              aria-pressed="true"
            >
              <span
                class="zs-icon zs-icon-sm asst-view-mode-icon zs-icon-subject"
                aria-hidden="true"
              ></span>
              <span class="asst-view-mode-label"></span>
            </button>
            <button
              class="asst-button-compact"
              type="button"
              data-assistant-view-mode="bubble"
              aria-label=""
              aria-pressed="false"
            >
              <span
                class="zs-icon zs-icon-sm asst-view-mode-icon zs-icon-forum"
                aria-hidden="true"
              ></span>
              <span class="asst-view-mode-label"></span>
            </button>
          </div>
        </section>
        <section class="asst-plan-surface hidden" data-role="plan"></section>
        <section
          class="asst-hint-surface hidden"
          data-role="interaction"
        ></section>
        <section class="asst-reply-surface" data-role="composer"></section>
      </section>
      <section
        class="asst-panel-details-overlay hidden"
        data-role="details-drawer"
      ></section>
    </main>
    <script src="../shared/vendor/katex/katex.min.js"></script>
    <script src="../shared/vendor/markdown-it/markdown-it.min.js"></script>
    <script src="../shared/vendor/markdown-it-texmath/texmath.min.js"></script>
    <script src="../shared/assistant/assistant-transcript-renderer.js"></script>
    <script src="../shared/assistant/assistant-panel-model.js"></script>
    <script src="../shared/assistant/assistant-panel-renderer.js"></script>
    <script src="../shared/assistant/assistant-workspace-acp-child.js"></script>
  </body>
</html>
