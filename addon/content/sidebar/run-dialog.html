<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillRunner Workspace</title>
    <script src="../shared/theme.js"></script>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/icons.css?ui=20260614-icons-v1" />
    <link
      rel="stylesheet"
      href="../shared/assistant/assistant-panel-shared.css"
    />
    <link rel="stylesheet" href="./run-dialog.css" />
    <link rel="stylesheet" href="../shared/vendor/katex/katex.min.css" />
  </head>
  <body>
    <main id="run-root" class="skillrunner-panel-shell asst-panel-shell">
      <header
        id="skillrunner-toolbar"
        class="skillrunner-toolbar asst-shell-toolbar"
      ></header>
      <section
        id="skillrunner-banner"
        class="skillrunner-banner asst-banner"
      ></section>
      <section
        id="skillrunner-message-counter"
        class="assistant-message-counter-region hidden"
      ></section>
      <section
        id="skillrunner-drawer"
        class="skillrunner-drawer asst-panel-drawer-overlay hidden"
      ></section>
      <section
        id="skillrunner-details"
        class="skillrunner-details asst-panel-details-overlay hidden"
      ></section>
      <section id="skillrunner-main" class="skillrunner-main asst-panel-main">
        <section
          id="skillrunner-conversation-window"
          class="skillrunner-conversation-window asst-conversation-surface"
        >
          <section id="chat-panel" class="skillrunner-transcript"></section>
          <div
            class="asst-conversation-overlay-menu"
            aria-label="Conversation view"
          >
            <button
              id="chat-mode-plain"
              class="asst-button-compact"
              type="button"
              data-assistant-view-mode="plain"
              aria-label="Plain transcript view"
              aria-pressed="true"
            >
              <span
                class="zs-icon zs-icon-sm asst-view-mode-icon zs-icon-subject"
                aria-hidden="true"
              ></span>
              <span class="asst-view-mode-label">Plain</span>
            </button>
            <button
              id="chat-mode-bubble"
              class="asst-button-compact"
              type="button"
              data-assistant-view-mode="bubble"
              aria-label="Bubble conversation view"
              aria-pressed="false"
            >
              <span
                class="zs-icon zs-icon-sm asst-view-mode-icon zs-icon-forum"
                aria-hidden="true"
              ></span>
              <span class="asst-view-mode-label">Bubble</span>
            </button>
          </div>
        </section>
        <section
          id="skillrunner-plan"
          class="skillrunner-plan asst-plan-surface hidden"
        ></section>
        <section
          id="skillrunner-hint"
          class="skillrunner-hint asst-hint-surface hidden"
        ></section>
        <section
          id="reply-form"
          class="skillrunner-reply asst-reply-surface"
        ></section>
      </section>
    </main>
    <script src="../shared/vendor/katex/katex.min.js"></script>
    <script src="../shared/vendor/markdown-it/markdown-it.min.js"></script>
    <script src="../shared/vendor/markdown-it-texmath/texmath.min.js"></script>
    <script src="./run-dialog.bundle.js"></script>
  </body>
</html>
