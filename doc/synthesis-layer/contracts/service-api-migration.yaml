schema: synthesis.service_api_migration.v1
description: Current public Synthesis service migration inventory and direct-consumer allowlist.
service_source: src/modules/synthesis/service.ts
service_factory: createSynthesisService

isolated_repository:
  mode: isolated_shadow
  schema_version: synthesis-repository-foundation.v1
  application_schema_version: synthesis-topic-application-repository.v1
  citation_graph_application_schema_version: synthesis-citation-graph-application-repository.v1
  reference_refresh_application_schema_version: synthesis-reference-refresh-repository.v1
  reference_matching_review_application_schema_version: synthesis-reference-matching-review-repository.v1
  tag_vocabulary_application_schema_version: synthesis-tag-vocabulary-application-repository.v1
  table_families: [schema_meta, cache_basis, operation, topic_application_state, topic_application_projection, citation_graph_application_state, citation_node, citation_edge, citation_source_ownership, citation_incoming_group, citation_metrics_light, citation_metrics_complex, citation_layout_state, reference_application_state, reference_source, reference_artifact, reference_raw, reference_canonical, reference_redirect, reference_binding, reference_revision_review, reference_match_proposal, reference_matching_state, reference_matching_preparation, tag_application_state, tag_vocabulary_entry, tag_alias, tag_abbrev, tag_protocol, tag_validation_warning, tag_staged_suggestion, tag_audit, tag_effect]
  production_database_owner: plugin_composition
  production_canonical_file_owner: plugin_composition
  production_mutation_enabled: false
  remote_capability: false

isolated_topic_canonical_store:
  mode: isolated_shadow
  schema_version: synthesis-topic-canonical-store.v1
  root_scope: profile_runtime_root
  capability: topics.canonical.inspect
  production_route: false
  production_canonical_file_owner: plugin_composition
  production_mutation_enabled: false

isolated_topic_application:
  mode: isolated_shadow
  package: packages/synthesis-application
  use_cases: [list, detail, apply]
  asset_authority: materialized_only
  remote_capability: false
  production_route: false
  production_canonical_file_owner: plugin_composition
  production_mutation_enabled: false

isolated_citation_graph_application:
  mode: isolated_shadow
  package: packages/synthesis-application
  use_cases: [inspect, read_slice, read_metrics, read_layout, rebuild_full, refresh_metrics, recompute_layout]
  build_scope: full_only
  compute_owner: sidecar_worker
  remote_capability: false
  production_route: false
  automatic_invocation: false
  production_database_owner: plugin_composition
  production_mutation_enabled: false

isolated_reference_refresh_application:
  mode: isolated_shadow
  package: packages/synthesis-application
  use_cases: [inspect, read_sources, read_references, prepare_refresh, apply_refresh, discard_preparation]
  refresh_scope: full_or_bounded_sources
  host_materialization: prepare_apply
  remote_capability: false
  production_route: false
  automatic_invocation: false
  graph_execution: false
  related_items_effect: false
  production_database_owner: plugin_composition
  production_mutation_enabled: false

isolated_reference_matching_review_application:
  mode: isolated_shadow
  package: packages/synthesis-application
  use_cases: [inspect, list_proposals, prepare_matching, apply_matching, discard_preparation, review]
  compute_owner: in_process_engine
  remote_capability: false
  production_route: false
  automatic_invocation: false
  graph_execution: false
  related_items_effect: false
  production_database_owner: plugin_composition
  production_mutation_enabled: false

isolated_tag_vocabulary_application:
  mode: isolated_shadow
  package: packages/synthesis-application
  use_cases: [load, validate, list_staged, save, stage, update_staged, update_entry, delete_entry, promote, discard, clear_staged, rebuild_index, export_regulator_tags, replace_audit, clear_audit]
  compute_owner: sidecar_worker
  host_effect_default: unavailable
  remote_capability: false
  production_route: false
  automatic_invocation: false
  checkpoint_import_export: false
  production_database_owner: plugin_composition
  production_mutation_enabled: false

application_canaries:
  - id: workbench_chrome_operational
    package: packages/synthesis-application
    capability: workbench.chrome.read
    repository_mode: isolated_shadow
    production_route: false
    production_mutation_enabled: false
  - id: topic_canonical_inspect
    package: packages/synthesis-application
    capability: topics.canonical.inspect
    canonical_store_mode: isolated_shadow
    production_route: false
    production_mutation_enabled: false

internal_engines:
  - id: citation_graph_build
    contract: SynthesisCitationGraphBuildEngine
    implementation: in_process
    sidecar_worker_canary: true
    sidecar_transfer_canary: true
    sidecar_streaming_worker_canary: true
    production_worker: false
  - id: citation_graph_layout
    contract: SynthesisCitationGraphLayoutEngine
    implementation: sidecar_worker
    sidecar_worker_canary: false
    production_worker: true
  - id: citation_graph_metrics
    contract: SynthesisCitationGraphMetricsEngine
    implementation: sidecar_worker
    sidecar_worker_canary: false
    production_worker: true
  - id: reference_matcher
    contract: SynthesisReferenceMatcherEngine
    implementation: in_process
    production_worker: false
  - id: tag_vocabulary
    contract: SynthesisTagVocabularyEngine
    implementation: in_process
    production_worker: false
  - id: concept_kb_index
    contract: SynthesisConceptKbIndexEngine
    implementation: in_process
    production_worker: false
  - id: topic_graph_index
    contract: SynthesisTopicGraphIndexEngine
    implementation: in_process
    production_worker: false
  - id: topic_structured_artifact
    contract: SynthesisTopicStructuredArtifactEngine
    implementation: in_process
    production_worker: false

direct_consumers:
  - path: src/modules/synthesisClient/legacyComposition.ts
    role: client_composition

method_groups:
  - id: debug
    category: debug
    target_capability: debug
    disposition: client_capability
    consumer_groups: [host_bridge, mcp]
    methods:
      - resetSynthesisDatabase
      - debugSynthesisSnapshot
      - debugSynthesisCacheList
      - debugSynthesisOperationsList
      - debugSynthesisProfilerList
      - debugSynthesisPaperInspect
      - debugSynthesisTopicInspect
      - debugSynthesisDiff
      - debugSynthesisCleanInstallReset
      - getDebugSynthesisSnapshotInput

  - id: operation_lifecycle
    category: command
    target_capability: operations
    disposition: client_capability
    consumer_groups: [lifecycle, workbench, host_bridge]
    methods:
      - reconcileSynthesisRuntimeWorkStateOnStartup

  - id: workflow_apply
    category: command
    target_capability: workflow_apply
    disposition: client_capability
    consumer_groups: [workflow, host_bridge, mcp]
    methods:
      - applyLiteratureDigestSidecar
      - applyReferenceMatchingSidecar
      - applyTopicSynthesisResult

  - id: workbench_queries
    category: query
    target_capability: workbench
    disposition: client_capability
    consumer_groups: [workbench]
    methods:
      - getSynthesisBackgroundJobRows
      - getSynthesisWorkbenchChromeInput
      - getSynthesisWorkbenchSurfaceInput

  - id: legacy_full_snapshot
    category: query
    target_capability: debug
    disposition: remove
    consumer_groups: [workbench]
    methods:
      - getSynthesisSnapshot

  - id: host_notifications
    category: command
    target_capability: notifications.related_items
    disposition: client_capability
    consumer_groups: [observer]
    methods:
      - consumeRelatedItemsSyncEcho

  - id: related_items
    category: host_effect
    target_capability: references.related_items
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - syncRelatedItemsNow

  - id: topic_queries
    category: query
    target_capability: topics
    disposition: client_capability
    consumer_groups: [workbench, workflow, host_bridge, mcp]
    methods:
      - listDeletedTopicArtifacts
      - readTopicArtifact
      - readTopicDetail
      - listTopics
      - findTopicsByPaperRef
      - listWorkflowTopicOptions
      - getTopicContext
      - getTopicReport
      - resolveResolver

  - id: topic_commands
    category: command
    target_capability: topics
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - deleteTopicArtifact
      - purgeDeletedTopicArtifacts
      - rejectTopicDiscoveryHint
      - restoreTopicDiscoveryHint

  - id: review_input
    category: query
    target_capability: workflow_review
    disposition: client_capability
    consumer_groups: [workflow, host_bridge, mcp]
    methods:
      - getReviewInput

  - id: graph_queries
    category: query
    target_capability: graph
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - queryCitationGraphCluster
      - getCitationGraphSlice
      - getCitationGraphLayout
      - getCitationGraphMetrics
      - rankLibraryPapers
      - queryCitationGraph
      - readCitationGraphSnapshot

  - id: graph_commands
    category: command
    target_capability: graph
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - recomputeCitationGraphLayout
      - refreshCitationGraphCacheIncrementalNow
      - refreshCitationGraphMetricsNow
      - rebuildCitationGraphCacheNow
      - retryCitationGraphCacheRebuild

  - id: artifact_queries
    category: query
    target_capability: artifacts
    disposition: client_capability
    consumer_groups: [workbench, workflow, host_bridge, mcp]
    methods:
      - getPaperArtifactManifest
      - readPaperArtifacts
      - resolveTopicPaperDigest

  - id: artifact_export
    category: command
    target_capability: artifacts
    disposition: client_capability
    consumer_groups: [workflow, host_bridge, mcp]
    methods:
      - exportFilteredPaperArtifacts

  - id: library_index
    category: query
    target_capability: library_index
    disposition: client_capability
    consumer_groups: [host_bridge, mcp]
    methods:
      - getLibraryIndex

  - id: reference_queries
    category: query
    target_capability: references
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - getReferenceSidecarIndex
      - rankExternalReferences
      - getAttentionQueue
      - loadReferenceSidecarCacheStatus

  - id: reference_commands
    category: command
    target_capability: references
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - refreshReferenceSidecarNow
      - retryReferenceSidecarRefresh
      - runAdvancedReferenceMatchingNow
      - retryAdvancedReferenceMatching
      - applyReferenceMatchProposalAction
      - applyReferenceMatchProposalActions
      - applyCanonicalRevisionReviewAction
      - mergeEffectiveCanonicalReference
      - applyCanonicalRevisionMergeRequests
      - updateCanonicalReferenceMetadata
      - archiveCanonicalReference

  - id: tag_queries
    category: query
    target_capability: knowledge.tags
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - loadTagVocabulary
      - validateTagVocabulary
      - listStagedTagSuggestions

  - id: tag_commands
    category: command
    target_capability: knowledge.tags
    disposition: client_capability
    consumer_groups: [workbench, workflow, host_bridge, mcp]
    methods:
      - saveTagVocabulary
      - exportTagVocabularyCheckpoint
      - stageTagSuggestions
      - updateStagedTagSuggestion
      - updateTagVocabularyEntry
      - deleteTagVocabularyEntry
      - promoteStagedTagSuggestions
      - discardStagedTagSuggestions
      - clearStagedTagSuggestions
      - previewTagVocabularyImport
      - applyTagVocabularyImport
      - rebuildTagVocabularyIndex
      - exportTagVocabularyForRegulator
      - replaceTagAuditRecords
      - clearTagAuditRecord

  - id: concept_queries
    category: query
    target_capability: knowledge.concepts
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - queryConceptKb
      - loadConceptKb

  - id: concept_commands
    category: command
    target_capability: knowledge.concepts
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - updateConceptDisplayText
      - applyConceptReviewAction
      - deleteConceptEntries
      - exportConceptKbCheckpoint
      - rebuildConceptKbIndex

  - id: topic_graph_queries
    category: query
    target_capability: knowledge.topic_graph
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - loadTopicGraph

  - id: topic_graph_commands
    category: command
    target_capability: knowledge.topic_graph
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - exportTopicGraphCheckpoint
      - rebuildTopicGraphIndex
      - acceptTopicGraphRelation
      - rejectTopicGraphRelation
      - applyTopicGraphReviewAction

  - id: maintenance_queries
    category: query
    target_capability: maintenance
    disposition: client_capability
    consumer_groups: [host_bridge, mcp]
    methods:
      - getSchemas

  - id: maintenance_commands
    category: command
    target_capability: maintenance
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - previewSynthesisJsonImport
      - applySynthesisJsonImport
      - exportSynthesisCheckpoint
      - verifySynthesisCheckpoint

  - id: webdav_sync_queries
    category: query
    target_capability: sync.webdav
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - loadWebDavSyncState

  - id: webdav_sync_commands
    category: command
    target_capability: sync.webdav
    disposition: client_capability
    consumer_groups: [workbench, host_bridge, mcp]
    methods:
      - syncWebDavNow
      - pauseWebDavSync
      - resumeWebDavSync
      - retryWebDavSync
      - resolveWebDavSyncConflict
