name: Prebuild Synthesis Sidecar Runtime

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact full source commit to build
        required: true
        type: string
      request_id:
        description: Caller-selected correlation identifier
        required: true
        type: string

run-name: Synthesis sidecar prebuild ${{ inputs.request_id }}

concurrency:
  group: synthesis-sidecar-prebuild-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.recipe.outputs.build_matrix }}
      node_version: ${{ steps.recipe.outputs.node_version }}
      rust_toolchain: ${{ steps.recipe.outputs.rust_toolchain }}
      zig_version: ${{ steps.recipe.outputs.zig_version }}
      cargo_zigbuild_version: ${{ steps.recipe.outputs.cargo_zigbuild_version }}
      rust_source_fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      build_fingerprint: ${{ steps.fingerprint.outputs.build_fingerprint }}
      cache_resolution: ${{ steps.cache.outputs.resolution }}
    steps:
      - shell: bash
        run: test "$GITHUB_SHA" = "${{ inputs.source_sha }}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - id: recipe
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema == "synthesis-sidecar.build-recipe.v1" and
            (.targets | length == 7)
          ' native/synthesis-sidecar/build-recipe.json > /dev/null
          echo "build_matrix=$(jq -c .targets native/synthesis-sidecar/build-recipe.json)" >> "$GITHUB_OUTPUT"
          echo "node_version=$(jq -r .toolchain.node native/synthesis-sidecar/build-recipe.json)" >> "$GITHUB_OUTPUT"
          echo "rust_toolchain=$(jq -r .toolchain.rust native/synthesis-sidecar/build-recipe.json)" >> "$GITHUB_OUTPUT"
          echo "zig_version=$(jq -r .toolchain.zig native/synthesis-sidecar/build-recipe.json)" >> "$GITHUB_OUTPUT"
          echo "cargo_zigbuild_version=$(jq -r .toolchain.cargoZigbuild native/synthesis-sidecar/build-recipe.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.recipe.outputs.node_version }}
          cache: npm
      - run: npm ci
      - id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          source_fingerprint="$(npx tsx -e 'import { computeSynthesisRustSidecarSourceFingerprint } from "./scripts/synthesis-sidecar-runtime-release-governance.ts"; computeSynthesisRustSidecarSourceFingerprint().then(({ fingerprint }) => process.stdout.write(fingerprint))')"
          [[ "$source_fingerprint" =~ ^[a-f0-9]{64}$ ]]
          build_fingerprint="$(npx tsx -e 'import { computeSynthesisSidecarRuntimeBuildFingerprint } from "./scripts/synthesis-sidecar-runtime-release-governance.ts"; computeSynthesisSidecarRuntimeBuildFingerprint().then(({ fingerprint }) => process.stdout.write(fingerprint))')"
          [[ "$build_fingerprint" =~ ^[a-f0-9]{64}$ ]]
          {
            printf 'fingerprint=%s\n' "$source_fingerprint"
            printf 'build_fingerprint=%s\n' "$build_fingerprint"
          } >> "$GITHUB_OUTPUT"
      - name: Validate sidecar build recipe
        run: npx tsx -e 'import { readSynthesisSidecarRuntimeBuildRecipe } from "./scripts/synthesis-sidecar-runtime-release-governance.ts"; readSynthesisSidecarRuntimeBuildRecipe()'
      - id: cache
        name: Resolve prebuild artifact cache
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scaffold
          npx tsx scripts/resolve-synthesis-sidecar-runtime-cache.ts \
            --repo="$GITHUB_REPOSITORY" \
            --source-sha="${{ inputs.source_sha }}" \
            --build-fingerprint="${{ steps.fingerprint.outputs.build_fingerprint }}" \
            --source-fingerprint="${{ steps.fingerprint.outputs.fingerprint }}" \
            --exclude-run-id="$GITHUB_RUN_ID" \
            --output=.scaffold/cache-resolution.json
          jq -e '.schema == "synthesis-sidecar-runtime-cache-resolution.v2"' .scaffold/cache-resolution.json > /dev/null
          # Inject cache info into build matrix so each prebuild entry can skip
          # when its platform is already cached. jq chokes on `.cache[.platform].hit`
          # when the platform contains a hyphen, so use the has() guard.
          jq -c \
            --slurpfile cache .scaffold/cache-resolution.json \
            --argjson recipe_targets '${{ steps.recipe.outputs.build_matrix }}' \
            -n '
              $cache[0].platforms as $cache
              | $ARGS.named.recipe_targets
              | map(
                  . as $entry
                  | $entry
                  + (
                      if ($cache | has($entry.platform)) then
                        {
                          cacheHit: $cache[$entry.platform].hit,
                          cacheRunId: $cache[$entry.platform].runId,
                          cacheArtifactId: $cache[$entry.platform].artifact.artifactId,
                          cacheArtifactSize: $cache[$entry.platform].artifact.sizeInBytes,
                          cacheArchiveUrl: $cache[$entry.platform].artifact.archiveDownloadUrl
                        }
                      else
                        {
                          cacheHit: false,
                          cacheRunId: null,
                          cacheArtifactId: null,
                          cacheArtifactSize: 0,
                          cacheArchiveUrl: null
                        }
                      end
                    )
                )
            ' \
            > .scaffold/build-matrix.json
          echo "build_matrix=$(cat .scaffold/build-matrix.json)" >> "$GITHUB_OUTPUT"
          echo "resolution=$(jq -c . .scaffold/cache-resolution.json)" >> "$GITHUB_OUTPUT"

  prebuild:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - if: ${{ !matrix.cacheHit }}
        shell: bash
        run: test "$GITHUB_SHA" = "${{ inputs.source_sha }}"
      - if: ${{ !matrix.cacheHit }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - if: ${{ !matrix.cacheHit }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - if: ${{ !matrix.cacheHit }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.plan.outputs.node_version }}
          cache: npm
      - if: ${{ !matrix.cacheHit }}
        run: npm ci
      - id: fingerprint
        if: ${{ !matrix.cacheHit }}
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(npx tsx -e 'import { computeSynthesisRustSidecarSourceFingerprint } from "./scripts/synthesis-sidecar-runtime-release-governance.ts"; computeSynthesisRustSidecarSourceFingerprint().then(({ fingerprint }) => process.stdout.write(fingerprint))')"
          test "$fingerprint" = "${{ needs.plan.outputs.rust_source_fingerprint }}"
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
      - if: ${{ !matrix.cacheHit }}
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ needs.plan.outputs.rust_toolchain }}
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - if: ${{ !matrix.cacheHit && matrix.useZig }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ needs.plan.outputs.zig_version }}
      - if: ${{ !matrix.cacheHit && matrix.useZig }}
        run: cargo install cargo-zigbuild --locked --version "${{ needs.plan.outputs.cargo_zigbuild_version }}"
      - name: Verify and package exact candidate
        if: ${{ !matrix.cacheHit }}
        env:
          SYNTHESIS_RUST_BUILD_FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +${{ needs.plan.outputs.rust_toolchain }} fmt --manifest-path native/synthesis-sidecar/Cargo.toml --all --check
          cargo +${{ needs.plan.outputs.rust_toolchain }} clippy --workspace --all-targets --locked --manifest-path native/synthesis-sidecar/Cargo.toml -- -D warnings
          cargo +${{ needs.plan.outputs.rust_toolchain }} test --workspace --locked --manifest-path native/synthesis-sidecar/Cargo.toml
          npm run check:synthesis-cross-language-contracts
          npx tsx scripts/check-synthesis-native-runtime-contract-parity.ts
          npx tsx scripts/check-synthesis-durable-foundation-parity.ts
          npx tsx scripts/check-synthesis-typed-application-parity.ts
          npx tsx scripts/check-synthesis-citation-reference-application-parity.ts
          npx tsx scripts/check-synthesis-tag-concept-topic-graph-application-parity.ts
          npx tsx scripts/check-synthesis-checkpoint-bundle-webdav-debug-application-parity.ts
          npx tsx scripts/check-synthesis-rust-license-inventory.ts
          if [ "${{ matrix.useZig }}" = "true" ]; then
            cargo +${{ needs.plan.outputs.rust_toolchain }} zigbuild --release --locked --target "${{ matrix.target }}" --manifest-path native/synthesis-sidecar/Cargo.toml --bin synthesis-sidecar
            binary="native/synthesis-sidecar/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          else
            cargo +${{ needs.plan.outputs.rust_toolchain }} build --release --locked --target "${{ matrix.target }}" --manifest-path native/synthesis-sidecar/Cargo.toml --bin synthesis-sidecar
            binary="native/synthesis-sidecar/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          fi
          created_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          npm run package:synthesis-sidecar-runtime -- --target="${{ matrix.platform }}" --rust-sidecar="$binary" --created-at="$created_at" --output=".scaffold/synthesis-sidecar-runtime/${{ matrix.platform }}"
          if [ "${{ matrix.nativeSmoke }}" = "true" ]; then
            npx tsx scripts/check-synthesis-native-worker-transfer-parity.ts --binary="$binary" --target="${{ matrix.platform }}"
            npx tsx scripts/smoke-synthesis-rust-sidecar-worker.ts "$binary" ".scaffold/synthesis-sidecar-runtime/${{ matrix.platform }}/provenance.json"
            npx tsx scripts/smoke-synthesis-rust-durable-candidate.ts "$binary" "${{ matrix.platform }}"
          fi
          tar -czf ".scaffold/synthesis-sidecar-runtime-${{ matrix.platform }}.tar.gz" -C .scaffold/synthesis-sidecar-runtime "${{ matrix.platform }}"
      - if: ${{ !matrix.cacheHit }}
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-sidecar-runtime-${{ matrix.platform }}
          path: .scaffold/synthesis-sidecar-runtime-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
      - if: ${{ matrix.cacheHit }}
        name: Cache hit for ${{ matrix.platform }} (run ${{ matrix.cacheRunId }})
        run: |
          echo "Skipping prebuild for ${{ matrix.platform }}, cache hit satisfied by run ${{ matrix.cacheRunId }} (artifact ${{ matrix.cacheArtifactId }}, ${{ matrix.cacheArtifactSize }} bytes)."
          mkdir -p .scaffold/prebuild
          npx tsx scripts/download-synthesis-sidecar-runtime-cache.ts \
            --run-id="${{ matrix.cacheRunId }}" \
            --artifact-id="${{ matrix.cacheArtifactId }}" \
            --archive-url="${{ matrix.cacheArchiveUrl }}" \
            --artifact-size="${{ matrix.cacheArtifactSize }}" \
            --target="${{ matrix.platform }}" \
            --output-root=.scaffold/prebuild

  publish-set:
    needs: [plan, prebuild]
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        run: test "$GITHUB_SHA" = "${{ inputs.source_sha }}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.plan.outputs.node_version }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: synthesis-sidecar-runtime-*
          path: .scaffold/prebuild
          merge-multiple: true
      - name: Assemble and publish immutable set
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          GH_TOKEN: ${{ secrets.SYNTHESIS_SIDECAR_RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(npx tsx -e 'import { computeSynthesisSidecarRuntimeBuildFingerprint } from "./scripts/synthesis-sidecar-runtime-release-governance.ts"; computeSynthesisSidecarRuntimeBuildFingerprint().then(x => process.stdout.write(x.fingerprint))')"
          source_fingerprint="$(npx tsx -e 'import { computeSynthesisRustSidecarSourceFingerprint } from "./scripts/synthesis-sidecar-runtime-release-governance.ts"; computeSynthesisRustSidecarSourceFingerprint().then(x => process.stdout.write(x.fingerprint))')"
          test "$source_fingerprint" = "${{ needs.plan.outputs.rust_source_fingerprint }}"
          npm run prebuild:synthesis-sidecar-runtime -- --archive-root=.scaffold/prebuild --output-root=prebuild-store --build-fingerprint="$fingerprint" --source-fingerprint="$source_fingerprint"
          aggregate="$(jq -r '.aggregate // empty' prebuild-store/sets/*/manifest.json | head -1)"
          if [ -z "$aggregate" ]; then
            echo "ERROR: staging produced no aggregate"
            ls -la prebuild-store/sets/ 2>&1 || true
            exit 1
          fi
          git clone --depth=1 --branch synthesis-sidecar-runtime-prebuilds "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" store 2>/dev/null || {
            git init store
            git -C store checkout --orphan synthesis-sidecar-runtime-prebuilds
            git -C store remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          }
          mkdir -p "store/sets/$aggregate"
          cp -a "prebuild-store/sets/$aggregate/." "store/sets/$aggregate/"
          git -C store add "sets/$aggregate"
          if ! git -C store diff --cached --quiet; then
            git -C store -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot] commit -m "Synthesis sidecar prebuild $aggregate"
            git -C store push origin HEAD:synthesis-sidecar-runtime-prebuilds
          fi
          commit="$(git -C store rev-parse HEAD)"
          cache_summary="$(jq -c '
            {
              cacheHits: (.platforms | with_entries(select(.value.hit == true)) | keys),
              cacheMisses: (.platforms | with_entries(select(.value.hit != true)) | keys),
              cacheSourceRuns: ([.platforms[] | select(.hit == true) | .runId] | unique)
            }
          ' <<<'${{ needs.plan.outputs.cache_resolution }}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg source_sha "${{ inputs.source_sha }}" --arg request_id "$REQUEST_ID" --arg fingerprint "$fingerprint" --arg aggregate "$aggregate" --arg commit "$commit" --arg run_id "$GITHUB_RUN_ID" --argjson cache "$cache_summary" '{schema:"synthesis-sidecar-runtime-prebuild-result.v2",repository:$repository,workflow:"prebuild-synthesis-sidecar-runtime.yml",runId:($run_id|tonumber),requestId:$request_id,sourceSha:$source_sha,buildFingerprint:$fingerprint,aggregate:$aggregate,prebuildBranch:"synthesis-sidecar-runtime-prebuilds",prebuildCommit:$commit,setPath:("sets/"+$aggregate),cache:$cache}' > prebuild-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthesis-sidecar-runtime-prebuild-result
          path: prebuild-result.json
          if-no-files-found: error
