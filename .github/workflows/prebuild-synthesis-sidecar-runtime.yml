name: Prebuild Synthesis Sidecar Runtime

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact full source commit to build
        required: true
        type: string
      request_id:
        description: Caller-selected correlation identifier
        required: true
        type: string

run-name: Synthesis sidecar prebuild ${{ inputs.request_id }}

concurrency:
  group: synthesis-sidecar-prebuild-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.cache.outputs.build_matrix }}
      node_version: ${{ steps.recipe.outputs.node_version }}
      rust_toolchain: ${{ steps.recipe.outputs.rust_toolchain }}
      zig_version: ${{ steps.recipe.outputs.zig_version }}
      cargo_zigbuild_version: ${{ steps.recipe.outputs.cargo_zigbuild_version }}
      source_fingerprint: ${{ steps.identities.outputs.source_fingerprint }}
      build_fingerprint: ${{ steps.identities.outputs.build_fingerprint }}
      verification_fingerprint: ${{ steps.identities.outputs.verification_fingerprint }}
      pipeline_revision: ${{ steps.identities.outputs.pipeline_revision }}
      verification_run_id: ${{ steps.verification.outputs.run_id }}
      verification_source_sha: ${{ steps.verification.outputs.source_sha }}
      verification_event: ${{ steps.verification.outputs.event }}
    steps:
      - shell: bash
        run: test "$GITHUB_SHA" = "${{ inputs.source_sha }}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - id: recipe
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema == "synthesis-sidecar.build-recipe.v1" and (.targets | length == 7)' native/synthesis-sidecar/build-recipe.json > /dev/null
          echo "recipe=$(jq -c .targets native/synthesis-sidecar/build-recipe.json)" >> "$GITHUB_OUTPUT"
          echo "node_version=$(jq -r .toolchain.node native/synthesis-sidecar/build-recipe.json)" >> "$GITHUB_OUTPUT"
          echo "rust_toolchain=$(jq -r .toolchain.rust native/synthesis-sidecar/build-recipe.json)" >> "$GITHUB_OUTPUT"
          echo "zig_version=$(jq -r .toolchain.zig native/synthesis-sidecar/build-recipe.json)" >> "$GITHUB_OUTPUT"
          echo "cargo_zigbuild_version=$(jq -r .toolchain.cargoZigbuild native/synthesis-sidecar/build-recipe.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.recipe.outputs.node_version }}
          cache: npm
      - run: npm ci
      - id: identities
        name: Compute governed identities
        shell: bash
        run: |
          set -euo pipefail
          identities="$(npx tsx -e 'import { computeSynthesisSidecarRuntimeIdentities } from "./scripts/synthesis-sidecar-runtime-release-governance.ts"; computeSynthesisSidecarRuntimeIdentities().then(x => process.stdout.write(JSON.stringify(x)))')"
          {
            echo "source_fingerprint=$(jq -r .sourceFingerprint <<<"$identities")"
            echo "build_fingerprint=$(jq -r .buildFingerprint <<<"$identities")"
            echo "verification_fingerprint=$(jq -r .verificationFingerprint <<<"$identities")"
            echo "pipeline_revision=$(jq -r .pipelineRevision <<<"$identities")"
          } >> "$GITHUB_OUTPUT"
      - id: verification
        name: Resolve trusted three-host verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/resolve-synthesis-sidecar-verification.ts \
            --repo="$GITHUB_REPOSITORY" \
            --source-sha="${{ inputs.source_sha }}" \
            --verification-fingerprint="${{ steps.identities.outputs.verification_fingerprint }}" \
            --pipeline-revision="${{ steps.identities.outputs.pipeline_revision }}" \
            --output=.scaffold/verification-result.json
          {
            echo "run_id=$(jq -r .runId .scaffold/verification-result.json)"
            echo "source_sha=$(jq -r .sourceSha .scaffold/verification-result.json)"
            echo "event=$(jq -r .event .scaffold/verification-result.json)"
          } >> "$GITHUB_OUTPUT"
      - id: cache
        name: Resolve prebuild artifact candidates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/resolve-synthesis-sidecar-runtime-cache.ts \
            --repo="$GITHUB_REPOSITORY" \
            --source-sha="${{ inputs.source_sha }}" \
            --build-fingerprint="${{ steps.identities.outputs.build_fingerprint }}" \
            --source-fingerprint="${{ steps.identities.outputs.source_fingerprint }}" \
            --exclude-run-id="$GITHUB_RUN_ID" \
            --output=.scaffold/cache-resolution.json
          jq -e '.schema == "synthesis-sidecar-runtime-cache-resolution.v3"' .scaffold/cache-resolution.json > /dev/null
          jq -c --slurpfile cache .scaffold/cache-resolution.json --argjson recipe '${{ steps.recipe.outputs.recipe }}' -n '
            $cache[0].platforms as $cache
            | $recipe
            | map(. as $entry | $entry + (
                if $cache[$entry.platform].candidate then {
                  cacheCandidate: true,
                  cacheRunId: $cache[$entry.platform].runId,
                  cacheSourceSha: $cache[$entry.platform].sourceSha,
                  cacheArtifactId: $cache[$entry.platform].artifact.artifactId,
                  cacheArtifactSize: $cache[$entry.platform].artifact.sizeInBytes,
                  cacheArchiveUrl: $cache[$entry.platform].artifact.archiveDownloadUrl
                } else {cacheCandidate:false} end
              ))
          ' > .scaffold/build-matrix.json
          echo "build_matrix=$(cat .scaffold/build-matrix.json)" >> "$GITHUB_OUTPUT"

  prebuild:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ needs.plan.outputs.node_version }}
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ needs.plan.outputs.rust_toolchain }}
          targets: ${{ matrix.target }}
      - if: ${{ matrix.useZig }}
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406
        with:
          version: ${{ needs.plan.outputs.zig_version }}
      - if: ${{ matrix.useZig }}
        run: cargo install cargo-zigbuild --locked --version "${{ needs.plan.outputs.cargo_zigbuild_version }}"
      - id: cache
        if: ${{ matrix.cacheCandidate }}
        continue-on-error: true
        name: Validate cached candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/download-synthesis-sidecar-runtime-cache.ts \
            --run-id="${{ matrix.cacheRunId }}" \
            --artifact-id="${{ matrix.cacheArtifactId }}" \
            --archive-url="${{ matrix.cacheArchiveUrl }}" \
            --artifact-size="${{ matrix.cacheArtifactSize }}" \
            --target="${{ matrix.platform }}" \
            --expected-build-fingerprint="${{ needs.plan.outputs.build_fingerprint }}" \
            --expected-source-fingerprint="${{ needs.plan.outputs.source_fingerprint }}" \
            --output-root=.scaffold/prebuild
      - name: Build and package target
        if: ${{ !matrix.cacheCandidate || steps.cache.outcome != 'success' }}
        env:
          SYNTHESIS_RUST_BUILD_FINGERPRINT: ${{ needs.plan.outputs.build_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.useZig }}" = "true" ]; then
            cargo +${{ needs.plan.outputs.rust_toolchain }} zigbuild --release --locked --target "${{ matrix.target }}" --manifest-path native/synthesis-sidecar/Cargo.toml --bin synthesis-sidecar
          else
            cargo +${{ needs.plan.outputs.rust_toolchain }} build --release --locked --target "${{ matrix.target }}" --manifest-path native/synthesis-sidecar/Cargo.toml --bin synthesis-sidecar
          fi
          binary="native/synthesis-sidecar/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          npm run package:synthesis-sidecar-runtime -- --target="${{ matrix.platform }}" --rust-sidecar="$binary" --created-at="$created_at" --output=".scaffold/synthesis-sidecar-runtime/${{ matrix.platform }}"
          tar -czf ".scaffold/synthesis-sidecar-runtime-${{ matrix.platform }}.tar.gz" -C .scaffold/synthesis-sidecar-runtime "${{ matrix.platform }}"
      - name: Run current native smoke
        if: ${{ matrix.nativeSmoke }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cacheCandidate }}" = "true" ] && [ "${{ steps.cache.outcome }}" = "success" ]; then
            bundle=".scaffold/prebuild/bundles/${{ matrix.platform }}"
          else
            bundle=".scaffold/synthesis-sidecar-runtime/${{ matrix.platform }}"
          fi
          binary="$bundle/${{ matrix.binary }}"
          npx tsx scripts/smoke-synthesis-rust-sidecar-worker.ts "$binary" "${{ needs.plan.outputs.build_fingerprint }}"
          npx tsx scripts/smoke-synthesis-rust-durable-candidate.ts "$binary" "${{ matrix.platform }}"
      - name: Validate archive and write target evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scaffold/current-artifact .scaffold/evidence
          if [ "${{ matrix.cacheCandidate }}" = "true" ] && [ "${{ steps.cache.outcome }}" = "success" ]; then
            mode="reused"
            artifact_run_id="${{ matrix.cacheRunId }}"
            artifact_source_sha="${{ matrix.cacheSourceSha }}"
            source_archive=".scaffold/prebuild/synthesis-sidecar-runtime-${{ matrix.platform }}.tar.gz"
          else
            mode="built"
            artifact_run_id="$GITHUB_RUN_ID"
            artifact_source_sha="${{ inputs.source_sha }}"
            source_archive=".scaffold/synthesis-sidecar-runtime-${{ matrix.platform }}.tar.gz"
          fi
          archive=".scaffold/current-artifact/synthesis-sidecar-runtime-${{ matrix.platform }}.tar.gz"
          node -e 'require("node:fs").copyFileSync(process.argv[1], process.argv[2])' "$source_archive" "$archive"
          archive_sha="$(npx tsx -e 'import { sha256File } from "./scripts/synthesis-sidecar-runtime-release-governance.ts"; sha256File(process.argv[1]).then(x => process.stdout.write(x))' "$archive")"
          archive_bytes="$(node -e 'process.stdout.write(String(require("node:fs").statSync(process.argv[1]).size))' "$archive")"
          if [ "${{ matrix.nativeSmoke }}" = "true" ]; then
            smoke="$(jq -n --arg run "$GITHUB_RUN_ID" '{status:"passed",runId:($run|tonumber)}')"
          else
            smoke='{"status":"not_applicable"}'
          fi
          jq -n --arg target "${{ matrix.platform }}" --arg mode "$mode" --arg artifact_run_id "$artifact_run_id" --arg artifact_source_sha "$artifact_source_sha" --arg archive_sha "$archive_sha" --arg archive_bytes "$archive_bytes" --argjson smoke "$smoke" '{target:$target,mode:$mode,artifactRunId:($artifact_run_id|tonumber),artifactSourceSha:$artifact_source_sha,archiveSha256:$archive_sha,archiveBytes:($archive_bytes|tonumber),smoke:$smoke}' > ".scaffold/evidence/${{ matrix.platform }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthesis-sidecar-runtime-${{ matrix.platform }}
          path: .scaffold/current-artifact/synthesis-sidecar-runtime-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthesis-sidecar-runtime-evidence-${{ matrix.platform }}
          path: .scaffold/evidence/${{ matrix.platform }}.json
          if-no-files-found: error

  publish-set:
    needs: [plan, prebuild]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ needs.plan.outputs.node_version }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: synthesis-sidecar-runtime-*
          path: .scaffold/downloads
      - name: Assemble and publish immutable set
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          GH_TOKEN: ${{ secrets.SYNTHESIS_SIDECAR_RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scaffold/prebuild .scaffold/evidence
          find .scaffold/downloads -name 'synthesis-sidecar-runtime-*.tar.gz' -exec cp {} .scaffold/prebuild/ \;
          find .scaffold/downloads -name '*.json' -path '*runtime-evidence-*' -exec cp {} .scaffold/evidence/ \;
          test "$(find .scaffold/prebuild -name '*.tar.gz' | wc -l)" -eq 7
          test "$(find .scaffold/evidence -name '*.json' | wc -l)" -eq 7
          npm run prebuild:synthesis-sidecar-runtime -- --archive-root=.scaffold/prebuild --output-root=prebuild-store --build-fingerprint="${{ needs.plan.outputs.build_fingerprint }}" --source-fingerprint="${{ needs.plan.outputs.source_fingerprint }}"
          aggregate="$(jq -r '.aggregate // empty' prebuild-store/sets/*/manifest.json | head -1)"
          test -n "$aggregate"
          git clone --depth=1 --branch synthesis-sidecar-runtime-prebuilds "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" store 2>/dev/null || {
            git init store
            git -C store checkout --orphan synthesis-sidecar-runtime-prebuilds
            git -C store remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          }
          mkdir -p "store/sets/$aggregate"
          cp -a "prebuild-store/sets/$aggregate/." "store/sets/$aggregate/"
          git -C store add "sets/$aggregate"
          if ! git -C store diff --cached --quiet; then
            git -C store -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot] commit -m "Synthesis sidecar prebuild $aggregate"
            git -C store push origin HEAD:synthesis-sidecar-runtime-prebuilds
          fi
          commit="$(git -C store rev-parse HEAD)"
          targets="$(jq -s 'map({key:.target,value:(del(.target))}) | from_entries' .scaffold/evidence/*.json)"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg source_sha "${{ inputs.source_sha }}" --arg request_id "$REQUEST_ID" --arg run_id "$GITHUB_RUN_ID" --arg source_fingerprint "${{ needs.plan.outputs.source_fingerprint }}" --arg build_fingerprint "${{ needs.plan.outputs.build_fingerprint }}" --arg verification_fingerprint "${{ needs.plan.outputs.verification_fingerprint }}" --arg pipeline_revision "${{ needs.plan.outputs.pipeline_revision }}" --arg verification_run_id "${{ needs.plan.outputs.verification_run_id }}" --arg verification_source_sha "${{ needs.plan.outputs.verification_source_sha }}" --arg verification_event "${{ needs.plan.outputs.verification_event }}" --arg aggregate "$aggregate" --arg commit "$commit" --argjson targets "$targets" '{schema:"synthesis-sidecar-runtime-prebuild-result.v3",repository:$repository,workflow:"prebuild-synthesis-sidecar-runtime.yml",runId:($run_id|tonumber),requestId:$request_id,sourceSha:$source_sha,sourceFingerprint:$source_fingerprint,buildFingerprint:$build_fingerprint,verificationFingerprint:$verification_fingerprint,pipelineRevision:$pipeline_revision,verification:{runId:($verification_run_id|tonumber),sourceSha:$verification_source_sha,event:$verification_event},aggregate:$aggregate,prebuildBranch:"synthesis-sidecar-runtime-prebuilds",prebuildCommit:$commit,setPath:("sets/"+$aggregate),targets:$targets}' > prebuild-result.json
          npx tsx -e 'import { readFileSync } from "node:fs"; import { assertReleaseEligibleSynthesisSidecarRuntimePrebuildResult, rebuildSynthesisSidecarRuntimePrebuildResult } from "./packages/synthesis-contracts/src/sidecarRuntimeRelease.ts"; const value=rebuildSynthesisSidecarRuntimePrebuildResult(JSON.parse(readFileSync("prebuild-result.json","utf8"))); assertReleaseEligibleSynthesisSidecarRuntimePrebuildResult(value)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthesis-sidecar-runtime-prebuild-result
          path: prebuild-result.json
          if-no-files-found: error
