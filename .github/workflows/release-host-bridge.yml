name: Release Host Bridge

on:
  workflow_dispatch:
    inputs:
      release_set_id:
        description: Exact committed releaseSetId to publish or resume
        required: true
        type: string
      source_sha:
        description: Exact main commit containing the prepared release set
        required: true
        type: string
      request_id:
        description: Correlation ID supplied by the dispatch command
        required: true
        type: string

run-name: Host Bridge ${{ inputs.release_set_id }} (${{ inputs.request_id }})

concurrency:
  group: host-bridge-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      release_set_id: ${{ steps.plan.outputs.release_set_id }}
      needs_build: ${{ steps.plan.outputs.needs_build }}
      cli_aggregate: ${{ steps.plan.outputs.cli_aggregate }}
      build_matrix: ${{ steps.recipe.outputs.build_matrix }}
      rust_toolchain: ${{ steps.recipe.outputs.rust_toolchain }}
      zig_version: ${{ steps.recipe.outputs.zig_version }}
      cargo_zigbuild_version: ${{ steps.recipe.outputs.cargo_zigbuild_version }}
      node_version: ${{ steps.recipe.outputs.node_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - id: recipe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          node scripts/host-bridge-cli-release-governance.mjs recipe --json > .host-bridge-build-recipe.json
          echo "build_matrix=$(jq -c .targets .host-bridge-build-recipe.json)" >> "$GITHUB_OUTPUT"
          echo "node_version=$(jq -r .toolchain.node .host-bridge-build-recipe.json)" >> "$GITHUB_OUTPUT"
          echo "rust_toolchain=$(jq -r .toolchain.rust .host-bridge-build-recipe.json)" >> "$GITHUB_OUTPUT"
          echo "zig_version=$(jq -r .toolchain.zig .host-bridge-build-recipe.json)" >> "$GITHUB_OUTPUT"
          echo "cargo_zigbuild_version=$(jq -r .toolchain.cargoZigbuild .host-bridge-build-recipe.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.recipe.outputs.node_version }}
          cache: npm
      - run: npm ci
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          npm run release:host-bridge:plan -- --output=.host-bridge-plan.json
          release_set_id="$(jq -r .releaseSetId host-bridge/release-set.json)"
          test "$release_set_id" = "${{ inputs.release_set_id }}"
          needs_build="$(jq -r .prebuildRequired .host-bridge-plan.json)"
          cli_aggregate="$(jq -r .cli.binaryAggregateSha256 host-bridge/release-set.json)"
          echo "release_set_id=$release_set_id" >> "$GITHUB_OUTPUT"
          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"
          echo "cli_aggregate=$cli_aggregate" >> "$GITHUB_OUTPUT"
      - name: Check prepared surfaces against their recorded source
        shell: bash
        run: |
          export HOST_BRIDGE_SOURCE_COMMIT="$(jq -r .source.commit host-bridge/release-set.json)"
          npm run check:host-bridge-surface

  build:
    needs: plan
    if: needs.plan.outputs.needs_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.plan.outputs.node_version }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.plan.outputs.rust_toolchain }}
          targets: ${{ matrix.target }}
      - if: startsWith(matrix.platform, 'linux-')
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ needs.plan.outputs.zig_version }}
      - if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: cargo install cargo-zigbuild --locked --version "${{ needs.plan.outputs.cargo_zigbuild_version }}"
      - run: npm ci
      - run: node scripts/build-zotero-bridge-cli.mjs --platform=${{ matrix.platform }} --target=${{ matrix.target }}
      - if: ${{ !matrix.runtimeIdentity }}
        run: node scripts/check-zotero-bridge-cli-binary-identity.mjs --platform=${{ matrix.platform }} --binary=${{ matrix.binary }}
      - if: matrix.runtimeIdentity
        shell: bash
        run: addon/bin/${{ matrix.platform }}/${{ matrix.binary }} surface identity --json
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-bridge-${{ matrix.platform }}
          path: addon/bin/${{ matrix.platform }}
          if-no-files-found: error

  materialize:
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.HOST_BRIDGE_RELEASE_TOKEN || github.token }}
      PREBUILD_BRANCH: host-bridge-cli-prebuilds
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.plan.outputs.node_version }}
          cache: npm
      - run: npm ci
      - if: needs.plan.outputs.needs_build == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: zotero-bridge-*
          path: host-bridge-artifacts/prebuild-downloads
      - if: needs.plan.outputs.needs_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for artifact in host-bridge-artifacts/prebuild-downloads/zotero-bridge-*; do
            platform="${artifact##*/zotero-bridge-}"
            mkdir -p "addon/bin/$platform"
            cp -a "$artifact/." "addon/bin/$platform/"
          done
          chmod +x addon/bin/darwin-*/zotero-bridge addon/bin/linux-*/zotero-bridge
          node scripts/host-bridge-cli-release-governance.mjs record-binaries --write --dispatch-reason=release-set
      - name: Restore or append the exact branch prebuild set
        shell: bash
        run: |
          set -euo pipefail
          store="host-bridge-artifacts/prebuild-store"
          mkdir -p "$store"
          git -C "$store" init
          git -C "$store" config user.name github-actions[bot]
          git -C "$store" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$store" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code origin "refs/heads/${PREBUILD_BRANCH}" >/dev/null 2>&1; then
            git -C "$store" fetch --depth=1 origin "refs/heads/${PREBUILD_BRANCH}:refs/remotes/origin/${PREBUILD_BRANCH}"
            git -C "$store" checkout -B "$PREBUILD_BRANCH" "origin/$PREBUILD_BRANCH"
          else
            git -C "$store" checkout --orphan "$PREBUILD_BRANCH"
          fi

          aggregate="$(jq -r .binaryAggregateSha256 cli/zotero-bridge/release.json)"
          if [ "${{ needs.plan.outputs.needs_build }}" != "true" ] && [ -f "$store/sets/$aggregate/manifest.json" ]; then
            npm run sync:host-bridge-cli-prebuilds -- --aggregate="$aggregate" --branch="$PREBUILD_BRANCH"
          fi
          npm run check:host-bridge-cli-prebuild-freshness
          npx tsx scripts/stage-host-bridge-cli-prebuilds.ts --output-root="$store"
          git -C "$store" add "sets/$aggregate"
          if ! git -C "$store" diff --cached --quiet; then
            git -C "$store" commit -m "Store Host Bridge CLI prebuild $aggregate"
          fi
          git -C "$store" push origin "HEAD:refs/heads/${PREBUILD_BRANCH}"
          git -C "$store" rev-parse HEAD > host-bridge-artifacts/prebuild.commit
      - name: Bind and verify the materialized release set
        shell: bash
        run: |
          set -euo pipefail
          HOST_BRIDGE_SOURCE_COMMIT="${{ inputs.source_sha }}" npm run render:host-bridge-surface
          test "$(jq -r .releaseSetId host-bridge/release-set.json)" = "${{ inputs.release_set_id }}"
          npm run check:host-bridge-cli-prebuild-freshness
          HOST_BRIDGE_SOURCE_COMMIT="${{ inputs.source_sha }}" npm run check:host-bridge-surface
      - run: npx tsx scripts/materialize-host-bridge-surfaces.ts --output-root=host-bridge-artifacts/surfaces
      - name: Stage source finalization files
        shell: bash
        run: |
          set -euo pipefail
          root="host-bridge-artifacts/finalize"
          mkdir -p "$root/addon" "$root/cli/zotero-bridge" "$root/host-bridge" \
            "$root/skills_builtin/zotero-bridge-cli/assets" \
            "$root/skills_builtin/zotero-library-agent/assets" \
            "$root/profiles/hermes/zotero-librarian/assets"
          cp -a addon/bin "$root/addon/"
          cp cli/zotero-bridge/release.json "$root/cli/zotero-bridge/release.json"
          cp host-bridge/release-set.json "$root/host-bridge/release-set.json"
          cp skills_builtin/zotero-bridge-cli/assets/release-set.json "$root/skills_builtin/zotero-bridge-cli/assets/release-set.json"
          cp skills_builtin/zotero-library-agent/assets/release-set.json "$root/skills_builtin/zotero-library-agent/assets/release-set.json"
          cp profiles/hermes/zotero-librarian/assets/release-set.json "$root/profiles/hermes/zotero-librarian/assets/release-set.json"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "host-bridge-artifacts/surfaces/**"
      - uses: actions/upload-artifact@v4
        with:
          name: host-bridge-release-${{ needs.plan.outputs.release_set_id }}
          path: host-bridge-artifacts
          if-no-files-found: error

  publish:
    needs: [plan, build, materialize]
    if: ${{ always() && needs.plan.result == 'success' && needs.materialize.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.HOST_BRIDGE_RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          token: ${{ secrets.HOST_BRIDGE_RELEASE_TOKEN || github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: host-bridge-release-${{ needs.plan.outputs.release_set_id }}
          path: host-bridge-artifacts
      - name: Publish immutable commits and tags
        shell: bash
        run: |
          set -euo pipefail
          release_id="${{ needs.plan.outputs.release_set_id }}"
          publish_surface() {
            name="$1"; source="$2"; repo="$3"; branch="$4"
            work=".publish/$name"
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$work"
            git -C "$work" config user.name github-actions[bot]
            git -C "$work" config user.email 41898282+github-actions[bot]@users.noreply.github.com
            tag="host-bridge/$release_id"
            if git -C "$work" ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              git -C "$work" fetch origin "refs/tags/$tag:refs/tags/$tag"
              git -C "$work" checkout --detach "$tag"
              diff -u <(jq -S . "$source/manifest.json") <(jq -S . "$work/manifest.json")
              git -C "$work" rev-parse HEAD > ".publish/$name.commit"
              return
            fi
            git -C "$work" checkout -B "$branch"
            find "$work" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$source/." "$work/"
            git -C "$work" add -A
            if ! git -C "$work" diff --cached --quiet; then
              git -C "$work" commit -m "Publish Host Bridge $release_id"
            fi
            git -C "$work" tag "$tag"
            git -C "$work" push origin "refs/tags/$tag"
            git -C "$work" rev-parse HEAD > ".publish/$name.commit"
          }
          mkdir -p .publish
          publish_surface cli host-bridge-artifacts/surfaces/cli-bundle leike0813/zotero-agents host-bridge/zotero-bridge-cli-bundle
          publish_surface library host-bridge-artifacts/surfaces/library-agent leike0813/zotero-library-agent-bundle main
          publish_surface profile host-bridge-artifacts/surfaces/librarian-profile leike0813/zotero-librarian-profile main
      - name: Verify immutable manifests
        shell: bash
        run: |
          set -euo pipefail
          release_id="${{ needs.plan.outputs.release_set_id }}"
          verify_manifest() {
            repo="$1"; source="$2"
            gh api "repos/$repo/contents/manifest.json?ref=host-bridge/$release_id" --jq .content | base64 -d > .remote-manifest.json
            diff -u <(jq -S . "$source/manifest.json") <(jq -S . .remote-manifest.json)
          }
          verify_manifest leike0813/zotero-agents host-bridge-artifacts/surfaces/cli-bundle
          verify_manifest leike0813/zotero-library-agent-bundle host-bridge-artifacts/surfaces/library-agent
          verify_manifest leike0813/zotero-librarian-profile host-bridge-artifacts/surfaces/librarian-profile
      - name: Advance mutable pointers after all immutable surfaces verify
        shell: bash
        run: |
          set -euo pipefail
          advance_mutable_pointer() {
            work="$1"; branch="$2"
            remote_ref="refs/heads/$branch"
            if expected="$(git -C "$work" ls-remote --exit-code origin "$remote_ref" | awk '{print $1}')"; then
              git -C "$work" push --force-with-lease="$remote_ref:$expected" origin "HEAD:$remote_ref"
            else
              git -C "$work" push origin "HEAD:$remote_ref"
            fi
          }
          advance_mutable_pointer .publish/cli host-bridge/zotero-bridge-cli-bundle
          advance_mutable_pointer .publish/library main
          advance_mutable_pointer .publish/profile main
      - name: Write complete release receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg releaseSetId "${{ needs.plan.outputs.release_set_id }}" \
            --arg sourceCommit "${{ inputs.source_sha }}" \
            --arg workflowRun "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg pipelineRevision "$(git rev-parse '${{ inputs.source_sha }}:.github/workflows/release-host-bridge.yml')" \
            --arg prebuildCommit "$(cat host-bridge-artifacts/prebuild.commit)" \
            --arg cliCommit "$(cat .publish/cli.commit)" \
            --arg libraryCommit "$(cat .publish/library.commit)" \
            --arg profileCommit "$(cat .publish/profile.commit)" \
            '{schema:"host-bridge.release-receipt.v1",status:"complete",releaseSetId:$releaseSetId,sourceCommit:$sourceCommit,workflowRun:$workflowRun,pipelineRevision:$pipelineRevision,prebuild:{branch:"host-bridge-cli-prebuilds",commit:$prebuildCommit},surfaces:{cliBundle:{commit:$cliCommit},libraryAgent:{commit:$libraryCommit},librarianProfile:{commit:$profileCommit}}}' \
            > release-receipt.json
          cat release-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Finalize source main
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ inputs.source_sha }}"
          git fetch origin main
          changed="$(git diff --name-only "$source_sha..origin/main" -- \
            cli/zotero-bridge host-bridge skills_src profiles_src workflows_builtin \
            scripts/host-bridge\* scripts/render-host-bridge\* \
            scripts/render-zotero-library-agent\* scripts/render-zotero-librarian\*)"
          if [ -n "$changed" ]; then
            printf 'Host Bridge inputs changed while publishing:\n%s\n' "$changed" >&2
            exit 1
          fi
          git worktree add .finalize origin/main
          cp -a host-bridge-artifacts/finalize/. .finalize/
          cp release-receipt.json .finalize/host-bridge/latest-complete-release-receipt.json
          git -C .finalize add \
            addon/bin cli/zotero-bridge/release.json host-bridge \
            skills_builtin/zotero-bridge-cli/assets/release-set.json \
            skills_builtin/zotero-library-agent/assets/release-set.json \
            profiles/hermes/zotero-librarian/assets/release-set.json
          git -C .finalize diff --cached --check
          git -C .finalize config user.name github-actions[bot]
          git -C .finalize config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C .finalize commit -m "chore(host bridge): finalize ${{ needs.plan.outputs.release_set_id }} [skip host-bridge]"
          git -C .finalize push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-bridge-release-receipt-${{ needs.plan.outputs.release_set_id }}
          path: release-receipt.json
          if-no-files-found: warn
