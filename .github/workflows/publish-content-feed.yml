name: Publish Content Feed

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID supplied by the release command
        required: true
        type: string
      channels:
        description: Comma-separated stable, beta, and/or dev channels to publish
        required: true
        type: string

run-name: Content package ${{ inputs.request_id }}

permissions:
  contents: write

jobs:
  publish-content-feed:
    concurrency:
      group: content-feed-publish
      cancel-in-progress: false
    if: github.repository == 'leike0813/zotero-agents'
    runs-on: ubuntu-latest
    env:
      CONTENT_FEED_GITHUB_REPO: leike0813/zotero-agents-workflows
      CONTENT_PACKAGE_CHANNELS: ${{ inputs.channels }}
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main

      - name: Initialize content submodules
        run: git submodule update --init --recursive

      - name: Require the current Host Bridge complete receipt
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(jq -r .releaseSetId host-bridge/release-set.json)"
          test "$(jq -r .status host-bridge/latest-complete-release-receipt.json)" = "complete"
          test "$(jq -r .releaseSetId host-bridge/latest-complete-release-receipt.json)" = "$release_id"

      - name: Build content feeds
        run: npm run build:content-feed -- --channels "$CONTENT_PACKAGE_CHANNELS"

      - name: Upload content feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-packages
          path: artifact/content-packages

      - name: Check content feed publish token
        run: |
          if [ -z "${RELEASE_PAT}" ]; then
            echo "RELEASE_PAT secret is required to publish zotero-agents-workflows from this repository." >&2
            exit 1
          fi

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ env.RELEASE_PAT }}
        run: |
          VERSION="$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('content-package.version.json','utf8')); console.log(process.env.CONTENT_PACKAGE_VERSION || d.version)")"
          TAG="official-workflows-v${VERSION}"
          node --import tsx scripts/publish-content-package-github.ts \
            --repo "${CONTENT_FEED_GITHUB_REPO}" \
            --tag "${TAG}" \
            --title "Official Workflow Package ${VERSION}" \
            --notes "Official Zotero Agents Workflow package ${VERSION}." \
            artifact/content-packages/*/packages/*.zip \
            artifact/content-packages/*/packages/*.zip.sha256

      - name: Publish content-feed branch to GitHub content repo
        run: >-
          node --import tsx scripts/publish-content-package-feeds.ts
          --repo "$CONTENT_FEED_GITHUB_REPO"
          --source artifact/content-packages
          --channels "$CONTENT_PACKAGE_CHANNELS"
          --revision "$GITHUB_SHA"

      - name: Verify published content feeds
        run: npm run check:content-package-release -- --channels "$CONTENT_PACKAGE_CHANNELS"
