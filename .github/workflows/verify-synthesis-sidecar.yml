name: Verify Synthesis Sidecar

on:
  workflow_dispatch:
  push:
    paths:
      - "rust/synthesis-sidecar/**"
      - "src/modules/synthesis/**"
      - "src/modules/synthesisClient/**"
      - "src/modules/zoteroHostCapabilityBroker.ts"
      - "src/modules/zoteroHost/**"
      - "tests/zotero-host/102-zotero-host-broker-capability-api.test.ts"
      - "tests/zotero-host/91-zotero-test-infrastructure.test.ts"
      - "tests/helpers/pythonRuntime.ts"
      - "scripts/run-node-test-shards.ts"
      - ".github/actions/setup-builtin-skill-python/**"
      - "packages/synthesis-application/src/**"
      - "packages/synthesis-contracts/**"
      - "packages/synthesis-engine/src/**"
      - "packages/synthesis-repository/src/**"
      - "tests/synthesis/**"
      - "tests/tooling/*synthesis*.test.ts"
      - "tests/workflow-literature-analysis/**"
      - "tests/workflow-literature-workbench-package/**"
      - "tests/helpers/synthesis*.ts"
      - "workflows_builtin/**"
      - "skills_builtin/**"
      - "skills_src/**"
      - "scripts/content-package/**"
      - "scripts/synthesis/synthesis*.ts"
      - "scripts/synthesis/check-synthesis-*.ts"
      - "scripts/synthesis/smoke-synthesis-rust-*.ts"
      - "scripts/synthesis/synthesis-sidecar-runtime-release-governance.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-synthesis-sidecar.yml"
  pull_request:
    paths:
      - "rust/synthesis-sidecar/**"
      - "src/modules/synthesis/**"
      - "src/modules/synthesisClient/**"
      - "src/modules/zoteroHostCapabilityBroker.ts"
      - "src/modules/zoteroHost/**"
      - "tests/zotero-host/102-zotero-host-broker-capability-api.test.ts"
      - "tests/zotero-host/91-zotero-test-infrastructure.test.ts"
      - "tests/helpers/pythonRuntime.ts"
      - "scripts/run-node-test-shards.ts"
      - ".github/actions/setup-builtin-skill-python/**"
      - "packages/synthesis-application/src/**"
      - "packages/synthesis-contracts/**"
      - "packages/synthesis-engine/src/**"
      - "packages/synthesis-repository/src/**"
      - "tests/synthesis/**"
      - "tests/tooling/*synthesis*.test.ts"
      - "tests/workflow-literature-analysis/**"
      - "tests/workflow-literature-workbench-package/**"
      - "tests/helpers/synthesis*.ts"
      - "workflows_builtin/**"
      - "skills_builtin/**"
      - "skills_src/**"
      - "scripts/content-package/**"
      - "scripts/synthesis/synthesis*.ts"
      - "scripts/synthesis/check-synthesis-*.ts"
      - "scripts/synthesis/smoke-synthesis-rust-*.ts"
      - "scripts/synthesis/synthesis-sidecar-runtime-release-governance.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-synthesis-sidecar.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "24.18.0"
  RUST_TOOLCHAIN: "nightly-2026-07-25"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize pinned builtin skills
        run: git submodule update --init --depth 1 -- skills_builtin/literature-analysis skills_builtin/literature-explainer skills_builtin/literature-translator
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prepare builtin Skill Python runtime
        uses: ./.github/actions/setup-builtin-skill-python
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Compute governed identities
        shell: bash
        run: |
          set -euo pipefail
          build_fingerprint="$(npx tsx -e 'import { computeSynthesisSidecarRuntimeIdentities } from "./scripts/synthesis/synthesis-sidecar-runtime-release-governance.ts"; computeSynthesisSidecarRuntimeIdentities().then(x => process.stdout.write(x.buildFingerprint))')"
          printf 'SYNTHESIS_RUST_BUILD_FINGERPRINT=%s\n' "$build_fingerprint" >> "$GITHUB_ENV"
      - name: Format and lint
        run: |
          cargo +${{ env.RUST_TOOLCHAIN }} fmt --manifest-path rust/synthesis-sidecar/Cargo.toml --all --check
          cargo +${{ env.RUST_TOOLCHAIN }} clippy --workspace --all-targets --locked --manifest-path rust/synthesis-sidecar/Cargo.toml -- -D warnings
      - name: Run complete Rust workspace
        run: cargo +${{ env.RUST_TOOLCHAIN }} test --workspace --locked --no-fail-fast --manifest-path rust/synthesis-sidecar/Cargo.toml
      - name: Build synthesis sidecar binary
        run: cargo +${{ env.RUST_TOOLCHAIN }} build --locked --manifest-path rust/synthesis-sidecar/Cargo.toml -p synthesis-sidecar
      - name: Run synthesis production route tests
        run: npx tsx scripts/run-node-test-shards.ts --suite synthesis-native-stage1
      - name: Run shared contract and license gates
        shell: bash
        env:
          SYNTHESIS_PROTOCOL_STRESS: "1"
        run: |
          set -euo pipefail
          npm run check:synthesis-native-runtime-contract-parity
          npm run check:synthesis-native-worker-transfer-parity
          npm run check:synthesis-rust-license-inventory
          npx tsx scripts/synthesis/check-synthesis-cross-language-contracts.ts | tee .scaffold/test/synthesis-protocol-coverage.json
      - name: Preserve executed protocol evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthesis-protocol-linux
          include-hidden-files: true
          path: |
            .scaffold/test/synthesis-protocol-coverage.json
            .scaffold/test/synthesis-protocol-execution/
            .scaffold/test/synthesis-protocol-observations/

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize pinned builtin skills
        run: git submodule update --init --depth 1 -- skills_builtin/literature-analysis skills_builtin/literature-explainer skills_builtin/literature-translator
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prepare builtin Skill Python runtime
        uses: ./.github/actions/setup-builtin-skill-python
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Compute governed identities
        shell: bash
        run: |
          build_fingerprint="$(npx tsx -e 'import { computeSynthesisSidecarRuntimeIdentities } from "./scripts/synthesis/synthesis-sidecar-runtime-release-governance.ts"; computeSynthesisSidecarRuntimeIdentities().then(x => process.stdout.write(x.buildFingerprint))')"
          printf 'SYNTHESIS_RUST_BUILD_FINGERPRINT=%s\n' "$build_fingerprint" >> "$GITHUB_ENV"
      - name: Run complete Rust workspace
        run: cargo +${{ env.RUST_TOOLCHAIN }} test --workspace --locked --no-fail-fast --manifest-path rust/synthesis-sidecar/Cargo.toml
      - name: Build synthesis sidecar binary
        run: cargo +${{ env.RUST_TOOLCHAIN }} build --locked --manifest-path rust/synthesis-sidecar/Cargo.toml -p synthesis-sidecar
      - name: Run synthesis production route tests
        run: npx tsx scripts/run-node-test-shards.ts --suite synthesis-native-stage1
      - name: Run shared contract and license gates
        shell: bash
        env:
          SYNTHESIS_PROTOCOL_STRESS: "1"
        run: |
          set -euo pipefail
          npm run check:synthesis-native-runtime-contract-parity
          npm run check:synthesis-native-worker-transfer-parity
          npm run check:synthesis-rust-license-inventory
          npx tsx scripts/synthesis/check-synthesis-cross-language-contracts.ts | tee .scaffold/test/synthesis-protocol-coverage.json
      - name: Preserve executed protocol evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthesis-protocol-windows
          include-hidden-files: true
          path: |
            .scaffold/test/synthesis-protocol-coverage.json
            .scaffold/test/synthesis-protocol-execution/
            .scaffold/test/synthesis-protocol-observations/

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize pinned builtin skills
        run: git submodule update --init --depth 1 -- skills_builtin/literature-analysis skills_builtin/literature-explainer skills_builtin/literature-translator
      - name: Use preinstalled GNU tar for deterministic archive tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/synthesis-gnu-tar"
          ln -s "$(command -v gtar)" "$RUNNER_TEMP/synthesis-gnu-tar/tar"
          echo "$RUNNER_TEMP/synthesis-gnu-tar" >> "$GITHUB_PATH"
          # Apple gzip timestamps pipe input unless explicitly disabled.
          echo 'GZIP=-n' >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prepare builtin Skill Python runtime
        uses: ./.github/actions/setup-builtin-skill-python
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Compute governed identities
        shell: bash
        run: |
          build_fingerprint="$(npx tsx -e 'import { computeSynthesisSidecarRuntimeIdentities } from "./scripts/synthesis/synthesis-sidecar-runtime-release-governance.ts"; computeSynthesisSidecarRuntimeIdentities().then(x => process.stdout.write(x.buildFingerprint))')"
          printf 'SYNTHESIS_RUST_BUILD_FINGERPRINT=%s\n' "$build_fingerprint" >> "$GITHUB_ENV"
      - name: Run complete Rust workspace
        run: cargo +${{ env.RUST_TOOLCHAIN }} test --workspace --locked --no-fail-fast --manifest-path rust/synthesis-sidecar/Cargo.toml
      - name: Build synthesis sidecar binary
        run: cargo +${{ env.RUST_TOOLCHAIN }} build --locked --manifest-path rust/synthesis-sidecar/Cargo.toml -p synthesis-sidecar
      - name: Run synthesis production route tests
        run: npx tsx scripts/run-node-test-shards.ts --suite synthesis-native-stage1
      - name: Run shared contract and license gates
        shell: bash
        env:
          SYNTHESIS_PROTOCOL_STRESS: "1"
        run: |
          set -euo pipefail
          npm run check:synthesis-native-runtime-contract-parity
          npm run check:synthesis-native-worker-transfer-parity
          npm run check:synthesis-rust-license-inventory
          npx tsx scripts/synthesis/check-synthesis-cross-language-contracts.ts | tee .scaffold/test/synthesis-protocol-coverage.json
      - name: Preserve executed protocol evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthesis-protocol-macos
          include-hidden-files: true
          path: |
            .scaffold/test/synthesis-protocol-coverage.json
            .scaffold/test/synthesis-protocol-execution/
            .scaffold/test/synthesis-protocol-observations/

  receipt:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Write closed verification receipt
        shell: bash
        run: |
          set -euo pipefail
          identities="$(npx tsx -e 'import { computeSynthesisSidecarRuntimeIdentities } from "./scripts/synthesis/synthesis-sidecar-runtime-release-governance.ts"; computeSynthesisSidecarRuntimeIdentities().then(x => process.stdout.write(JSON.stringify(x)))')"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg source_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_fingerprint "$(jq -r .sourceFingerprint <<<"$identities")" \
            --arg build_fingerprint "$(jq -r .buildFingerprint <<<"$identities")" \
            --arg verification_fingerprint "$(jq -r .verificationFingerprint <<<"$identities")" \
            --arg verification_pipeline_revision "$(jq -r .verificationPipelineRevision <<<"$identities")" \
            '{schema:"synthesis-sidecar-verification-result.v2",repository:$repository,workflow:"verify-synthesis-sidecar.yml",runId:($run_id|tonumber),event:$event,sourceSha:$source_sha,sourceFingerprint:$source_fingerprint,buildFingerprint:$build_fingerprint,verificationFingerprint:$verification_fingerprint,verificationPipelineRevision:$verification_pipeline_revision,hosts:{linux:"passed",windows:"passed",macos:"passed"}}' \
            > verification-result.json
          npx tsx -e 'import { readFileSync } from "node:fs"; import { rebuildSynthesisSidecarVerificationResult } from "./packages/synthesis-contracts/src/sidecarRuntimeRelease.ts"; rebuildSynthesisSidecarVerificationResult(JSON.parse(readFileSync("verification-result.json", "utf8")))'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthesis-sidecar-verification-result
          path: verification-result.json
          if-no-files-found: error
