name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Manual runs exist to resolve the real Zotero compatibility matrix for one
  # gate. They never publish; the release workflow stays tag-bound.
  workflow_dispatch:
    inputs:
      gate:
        description: Compatibility gate to resolve
        required: true
        type: choice
        default: pull-request
        options:
          - pull-request
          - main
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          node-version: 24
      - name: Run Lint
        run: npm run lint:check

  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          node-version: 24
      - name: Run Build
        run: npm run build
      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: .scaffold/build

  compatibility-e2e-linux-candidate:
    runs-on: ubuntu-24.04
    needs:
      - build
    continue-on-error: true
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          node-version: 24
      - name: Setup Synthesis sidecar toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-07-25
      - name: Download canonical plugin build
        uses: actions/download-artifact@v5
        with:
          name: build-result
          path: .scaffold/build
      - name: Prepare current-source Linux sidecar once
        env:
          ZOTERO_COMPAT_LANE: ${{ github.event_name == 'pull_request' && 'pull-request' || 'main' }}
        run: >-
          npm run test:zotero:compatibility:prepare --
          --build-root "$GITHUB_WORKSPACE/.scaffold/build"
      - name: Upload immutable Linux E2E candidate
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-e2e-linux-x64
          path: .scaffold/build

  compatibility-plan:
    runs-on: ubuntu-24.04
    outputs:
      blocking: ${{ steps.plan.outputs.blocking }}
      e2eBlocking: ${{ steps.plan.outputs.e2eBlocking }}
      nonblocking: ${{ steps.plan.outputs.nonblocking }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          node-version: 24
      - name: Resolve compatibility matrix from manifest
        id: plan
        shell: bash
        run: |
          gate="${{ inputs.gate }}"
          if [[ -z "$gate" ]]; then gate=pull-request; fi
          if [[ "${{ github.event_name }}" == "push" ]]; then gate=main; fi
          npx tsx scripts/run-zotero-compatibility-matrix.ts plan --gate "$gate" --json > "$RUNNER_TEMP/zotero-compatibility-plan.json"
          echo "blocking=$(jq -c '{include: [.include[] | select(.blocking and .domain != "e2e")]}' "$RUNNER_TEMP/zotero-compatibility-plan.json")" >> "$GITHUB_OUTPUT"
          echo "e2eBlocking=$(jq -c '{include: [.include[] | select(.blocking and .domain == "e2e")]}' "$RUNNER_TEMP/zotero-compatibility-plan.json")" >> "$GITHUB_OUTPUT"
          echo "nonblocking=$(jq -c '{include: [.include[] | select(.blocking | not)]}' "$RUNNER_TEMP/zotero-compatibility-plan.json")" >> "$GITHUB_OUTPUT"

  test-lite:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          node-version: 24
      - name: Read Host Bridge CLI test toolchain
        id: host_bridge_recipe
        shell: bash
        run: |
          node scripts/host-bridge/host-bridge-cli-release-governance.mjs recipe --json > "$RUNNER_TEMP/host-bridge-cli-recipe.json"
          echo "rust_toolchain=$(jq -r .toolchain.rust "$RUNNER_TEMP/host-bridge-cli-recipe.json")" >> "$GITHUB_OUTPUT"
      - name: Setup Host Bridge CLI test toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.host_bridge_recipe.outputs.rust_toolchain }}
      - name: Run PR gate (blocking)
        run: npm run test:gate:pr

  test-full:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          node-version: 24
      - name: Read Host Bridge CLI test toolchain
        id: host_bridge_recipe
        shell: bash
        run: |
          node scripts/host-bridge/host-bridge-cli-release-governance.mjs recipe --json > "$RUNNER_TEMP/host-bridge-cli-recipe.json"
          echo "rust_toolchain=$(jq -r .toolchain.rust "$RUNNER_TEMP/host-bridge-cli-recipe.json")" >> "$GITHUB_OUTPUT"
      - name: Setup Host Bridge CLI test toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.host_bridge_recipe.outputs.rust_toolchain }}
      - name: Initialize content submodules
        run: git submodule update --init skills_builtin
      - name: Run release gate (blocking)
        run: npm run test:gate:release

  zotero-compatibility-blocking:
    name: Zotero ${{ matrix.version }} / ${{ matrix.platform }} / ${{ matrix.mode }}
    needs:
      - build
      - compatibility-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-plan.outputs.blocking) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          node-version: 24
      - name: Download canonical plugin build
        uses: actions/download-artifact@v5
        with:
          name: build-result
          path: .scaffold/build
      - name: Restore authenticated Zotero archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zotero-host-cache/archives
          key: zotero-host-${{ matrix.platform }}-${{ matrix.version }}-${{ hashFiles('tests/zotero/compatibility-matrix.json') }}
      - name: Run real Zotero compatibility cell
        env:
          ZOTERO_COMPAT_FAMILIES: ${{ join(matrix.families, ',') }}
          ZOTERO_COMPAT_LANE: ${{ matrix.lane || 'pull-request' }}
          ZOTERO_COMPAT_FIXTURE_SCALE: ${{ matrix.fixtureScale || 'committed-seed' }}
          ZOTERO_COMPAT_BLOCKING: ${{ matrix.blocking }}
        shell: bash
        run: >-
          npx tsx scripts/run-zotero-compatibility-matrix.ts run
          --target "${{ matrix.targetId }}"
          --mode "${{ matrix.mode }}"
          --suite "${{ matrix.suite || 'lite' }}"
          --domain "${{ matrix.domain || 'all' }}"
          --cache-root "${{ runner.temp }}/zotero-host-cache"
          --runs-root "${{ runner.temp }}/zotero-compat-runs"
          --build-root "$GITHUB_WORKSPACE/.scaffold/build"
      - name: Upload compatibility receipt and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.id }}
          path: ${{ runner.temp }}/zotero-compat-runs
          if-no-files-found: warn
          retention-days: 30

  zotero-compatibility-e2e-blocking:
    name: Zotero ${{ matrix.version }} / ${{ matrix.platform }} / E2E
    needs:
      - build
      - compatibility-plan
      - compatibility-e2e-linux-candidate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-plan.outputs.e2eBlocking) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          node-version: 24
      # A promoted E2E cell needs the sidecar staged by the candidate job. That
      # job tolerates its own preparation failures, so `needs` still reports
      # success and this download is what fails the gate instead of silently
      # skipping it.
      - name: Download immutable E2E candidate
        uses: actions/download-artifact@v5
        with:
          name: compatibility-e2e-linux-x64
          path: .scaffold/build
      - name: Restore authenticated Zotero archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zotero-host-cache/archives
          key: zotero-host-${{ matrix.platform }}-${{ matrix.version }}-${{ hashFiles('tests/zotero/compatibility-matrix.json') }}
      - name: Run promoted E2E cell
        env:
          ZOTERO_COMPAT_FAMILIES: ${{ join(matrix.families, ',') }}
          ZOTERO_COMPAT_LANE: ${{ matrix.lane }}
          ZOTERO_COMPAT_FIXTURE_SCALE: ${{ matrix.fixtureScale }}
          ZOTERO_COMPAT_BLOCKING: ${{ matrix.blocking }}
        shell: bash
        run: >-
          npx tsx scripts/run-zotero-compatibility-matrix.ts run
          --target "${{ matrix.targetId }}"
          --mode "${{ matrix.mode }}"
          --suite "${{ matrix.suite }}"
          --domain "${{ matrix.domain }}"
          --cache-root "${{ runner.temp }}/zotero-host-cache"
          --runs-root "${{ runner.temp }}/zotero-compat-runs"
          --build-root "$GITHUB_WORKSPACE/.scaffold/build"
      - name: Upload promoted E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.id }}
          path: ${{ runner.temp }}/zotero-compat-runs
          if-no-files-found: warn
          retention-days: 30

  zotero-compatibility-evidence:
    name: Zotero ${{ matrix.version }} / ${{ matrix.platform }} / evidence
    needs:
      - build
      - compatibility-plan
      - compatibility-e2e-linux-candidate
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-plan.outputs.nonblocking) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          node-version: 24
      - name: Download canonical plugin build
        if: matrix.domain != 'e2e'
        uses: actions/download-artifact@v5
        with:
          name: build-result
          path: .scaffold/build
      - name: Download immutable E2E candidate
        if: matrix.domain == 'e2e'
        uses: actions/download-artifact@v5
        with:
          name: compatibility-e2e-linux-x64
          path: .scaffold/build
      - name: Restore authenticated Zotero archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zotero-host-cache/archives
          key: zotero-host-${{ matrix.platform }}-${{ matrix.version }}-${{ hashFiles('tests/zotero/compatibility-matrix.json') }}
      - name: Run real Zotero compatibility evidence cell
        env:
          ZOTERO_COMPAT_FAMILIES: ${{ join(matrix.families, ',') }}
          ZOTERO_COMPAT_LANE: ${{ matrix.lane || 'pull-request' }}
          ZOTERO_COMPAT_FIXTURE_SCALE: ${{ matrix.fixtureScale || 'committed-seed' }}
          ZOTERO_COMPAT_BLOCKING: ${{ matrix.blocking }}
        shell: bash
        run: >-
          npx tsx scripts/run-zotero-compatibility-matrix.ts run
          --target "${{ matrix.targetId }}"
          --mode "${{ matrix.mode }}"
          --suite "${{ matrix.suite || 'lite' }}"
          --domain "${{ matrix.domain || 'all' }}"
          --cache-root "${{ runner.temp }}/zotero-host-cache"
          --runs-root "${{ runner.temp }}/zotero-compat-runs"
          --build-root "$GITHUB_WORKSPACE/.scaffold/build"
      - name: Upload compatibility evidence receipt and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.id }}
          path: ${{ runner.temp }}/zotero-compat-runs
          if-no-files-found: warn
          retention-days: 30
