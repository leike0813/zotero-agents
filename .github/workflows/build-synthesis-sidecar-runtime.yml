name: Build Synthesis Native Sidecar Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - dev-refactor
    paths:
      - "package.json"
      - "package-lock.json"
      - "apps/synthesis-service/src/**"
      - "packages/synthesis-application/**"
      - "packages/synthesis-contracts/**"
      - "packages/synthesis-engine/**"
      - "packages/synthesis-repository/**"
      - "native/synthesis-sidecar/**"
      - "scripts/check-synthesis-*.ts"
      - "scripts/package-synthesis-sidecar-runtime.ts"
      - "scripts/smoke-synthesis-rust-*.ts"
      - "scripts/synthesis-sidecar-runtime-release-governance.ts"
      - ".github/workflows/build-synthesis-sidecar-runtime.yml"

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
          - target: darwin-x64
            os: macos-15-intel
          - target: darwin-arm64
            os: macos-15
          - target: linux-x86
            os: ubuntu-latest
            rust_target: i686-unknown-linux-gnu
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm
            os: ubuntu-latest
            rust_target: armv7-unknown-linux-gnueabihf
          - target: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-25
          components: rustfmt, clippy

      - name: Verify Rust workspace and cross-language parity
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-25 fmt \
            --manifest-path native/synthesis-sidecar/Cargo.toml \
            --all --check
          cargo +nightly-2026-07-25 clippy \
            --workspace --all-targets --locked \
            --manifest-path native/synthesis-sidecar/Cargo.toml \
            -- -D warnings
          cargo +nightly-2026-07-25 test \
            --workspace --locked \
            --manifest-path native/synthesis-sidecar/Cargo.toml
          npx tsx scripts/check-synthesis-cross-language-contracts.ts
          npx tsx scripts/check-synthesis-native-runtime-contract-parity.ts
          npx tsx scripts/check-synthesis-durable-foundation-parity.ts
          npx tsx scripts/check-synthesis-typed-application-parity.ts
          npx tsx scripts/check-synthesis-citation-reference-application-parity.ts
          npx tsx scripts/check-synthesis-tag-concept-topic-graph-application-parity.ts
          npx tsx scripts/check-synthesis-checkpoint-bundle-webdav-debug-application-parity.ts
          npx tsx scripts/check-synthesis-rust-license-inventory.ts

      - name: Build and package native candidate
        shell: bash
        run: |
          set -euo pipefail
          RUST_FINGERPRINT="$(npx tsx -e 'import { computeSynthesisRustSidecarSourceFingerprint } from "./scripts/synthesis-sidecar-runtime-release-governance.ts"; computeSynthesisRustSidecarSourceFingerprint().then((value) => process.stdout.write(value.fingerprint))')"
          if [ -n "${{ matrix.rust_target }}" ]; then
            rustup target add "${{ matrix.rust_target }}" --toolchain nightly-2026-07-25
            sudo apt-get update && sudo apt-get install -y gcc-multilib gcc-arm-linux-gnueabihf
            SYNTHESIS_RUST_BUILD_FINGERPRINT="${RUST_FINGERPRINT}" \
              cargo +nightly-2026-07-25 build --release --locked \
                --target "${{ matrix.rust_target }}" \
                --manifest-path native/synthesis-sidecar/Cargo.toml --bin synthesis-sidecar
            BINARY="native/synthesis-sidecar/target/${{ matrix.rust_target }}/release/synthesis-sidecar"
          else
            SYNTHESIS_RUST_BUILD_FINGERPRINT="${RUST_FINGERPRINT}" \
              cargo +nightly-2026-07-25 build --release --locked \
                --manifest-path native/synthesis-sidecar/Cargo.toml --bin synthesis-sidecar
            BINARY="native/synthesis-sidecar/target/release/synthesis-sidecar${{ startsWith(matrix.target, 'win32-') && '.exe' || '' }}"
          fi
          CREATED_AT="$(node -e 'const {execFileSync}=require("child_process"); const seconds=Number(execFileSync("git",["show","-s","--format=%ct"],{encoding:"utf8"}).trim()); process.stdout.write(new Date(seconds*1000).toISOString())')"
          npm run package:synthesis-sidecar-runtime -- \
            --target="${{ matrix.target }}" \
            --rust-sidecar="${BINARY}" \
            --created-at="${CREATED_AT}" \
            --output=".scaffold/synthesis-sidecar-runtime/${{ matrix.target }}"
          if [ -z "${{ matrix.rust_target }}" ]; then
            npx tsx scripts/check-synthesis-native-worker-transfer-parity.ts --binary="${BINARY}" --target="${{ matrix.target }}"
            npx tsx scripts/smoke-synthesis-rust-sidecar-worker.ts "${BINARY}" ".scaffold/synthesis-sidecar-runtime/${{ matrix.target }}/provenance.json"
            npx tsx scripts/smoke-synthesis-rust-durable-candidate.ts "${BINARY}" "${{ matrix.target }}"
          fi
          tar -czf \
            ".scaffold/synthesis-sidecar-runtime-${{ matrix.target }}.tar.gz" \
            -C .scaffold/synthesis-sidecar-runtime \
            "${{ matrix.target }}"
          node - ".scaffold/synthesis-sidecar-runtime-${{ matrix.target }}.tar.gz" <<'NODE'
          const fs = require("fs");
          const bytes = fs.statSync(process.argv[2]).size;
          if (bytes > 15 * 1024 * 1024) {
            throw new Error(`Compressed candidate exceeds 15 MiB: ${bytes}`);
          }
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: synthesis-sidecar-runtime-${{ matrix.target }}
          path: .scaffold/synthesis-sidecar-runtime-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  aggregate-budget:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: synthesis-sidecar-runtime-*
          path: .scaffold/candidates
          merge-multiple: true

      - name: Enforce seven-target aggregate budget
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const files = fs.readdirSync(".scaffold/candidates")
            .filter((name) => name.endsWith(".tar.gz"));
          if (files.length !== 7) {
            throw new Error(`Expected seven candidates, found ${files.length}`);
          }
          const bytes = files.reduce(
            (total, name) =>
              total + fs.statSync(path.join(".scaffold/candidates", name)).size,
            0,
          );
          if (bytes > 75 * 1024 * 1024) {
            throw new Error(`Candidates exceed 75 MiB aggregate: ${bytes}`);
          }
          NODE
