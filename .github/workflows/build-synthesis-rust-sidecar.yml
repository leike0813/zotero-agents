name: Build Synthesis Rust Sidecar Candidates

on:
  workflow_dispatch:
  push:
    branches:
      - dev-refactor
    paths:
      - "native/synthesis-sidecar/**"
      - "apps/synthesis-service/src/**"
      - "packages/synthesis-application/**"
      - "packages/synthesis-contracts/contract-set/synthesis-cross-language-v1/**"
      - "packages/synthesis-contracts/contract-set/synthesis-durable-foundation-v1/**"
      - "packages/synthesis-contracts/contract-set/synthesis-typed-application-parity-v1/**"
      - "packages/synthesis-contracts/contract-set/synthesis-citation-reference-application-parity-v1/**"
      - "packages/synthesis-contracts/contract-set/synthesis-tag-concept-topic-graph-application-parity-v1/**"
      - "packages/synthesis-engine/src/**"
      - "packages/synthesis-repository/**"
      - "scripts/check-synthesis-cross-language-contracts.ts"
      - "scripts/check-synthesis-durable-foundation-parity.ts"
      - "scripts/check-synthesis-typed-application-parity.ts"
      - "scripts/check-synthesis-citation-reference-application-parity.ts"
      - "scripts/check-synthesis-tag-concept-topic-graph-application-parity.ts"
      - "scripts/check-synthesis-rust-license-inventory.ts"
      - "scripts/smoke-synthesis-rust-durable-candidate.ts"
      - "scripts/smoke-synthesis-rust-sidecar-worker.ts"
      - "scripts/synthesis-sidecar-runtime-release-governance.ts"
      - ".github/workflows/build-synthesis-rust-sidecar.yml"

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
          - target: darwin-x64
            os: macos-15-intel
          - target: darwin-arm64
            os: macos-15
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@nightly-2026-07-25

      - name: Verify durable foundation parity
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-25 test --workspace --locked \
            --manifest-path native/synthesis-sidecar/Cargo.toml
          npx tsx scripts/check-synthesis-cross-language-contracts.ts
          npx tsx scripts/check-synthesis-durable-foundation-parity.ts
          npx tsx scripts/check-synthesis-typed-application-parity.ts
          npx tsx scripts/check-synthesis-citation-reference-application-parity.ts
          npx tsx scripts/check-synthesis-tag-concept-topic-graph-application-parity.ts
          npx tsx scripts/check-synthesis-rust-license-inventory.ts

      - name: Build candidate
        shell: bash
        run: |
          set -euo pipefail
          RUST_FINGERPRINT="$(npx tsx -e 'import { computeSynthesisRustSidecarSourceFingerprint } from "./scripts/synthesis-sidecar-runtime-release-governance.ts"; computeSynthesisRustSidecarSourceFingerprint().then((value) => process.stdout.write(value.fingerprint))')"
          SYNTHESIS_RUST_BUILD_FINGERPRINT="${RUST_FINGERPRINT}" \
            cargo +nightly-2026-07-25 build --release --locked \
              --manifest-path native/synthesis-sidecar/Cargo.toml \
              --bin synthesis-sidecar
          mkdir -p ".scaffold/rust-candidate/${{ matrix.target }}"
          cp "native/synthesis-sidecar/target/release/synthesis-sidecar${{ startsWith(matrix.target, 'win32-') && '.exe' || '' }}" \
            ".scaffold/rust-candidate/${{ matrix.target }}/synthesis-sidecar${{ startsWith(matrix.target, 'win32-') && '.exe' || '' }}"
          cp native/synthesis-sidecar/licenses.json \
            ".scaffold/rust-candidate/${{ matrix.target }}/licenses.json"
          node - "${RUST_FINGERPRINT}" "${{ matrix.target }}" <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const cargoLockSha256 = crypto
            .createHash("sha256")
            .update(fs.readFileSync("native/synthesis-sidecar/Cargo.lock"))
            .digest("hex");
          fs.writeFileSync(
            `.scaffold/rust-candidate/${process.argv[3]}/provenance.json`,
            `${JSON.stringify({
              schema: "synthesis-rust-sidecar-provenance.v1",
              target: process.argv[3],
              sourceFingerprint: process.argv[2],
              toolchain: "nightly-2026-07-25",
              durableFoundation: {
                rusqliteVersion: "0.40.1",
                defaultFeatures: false,
                features: ["backup", "bundled"],
                sqliteVersion: "3.53.2",
                sqliteLinkage: "bundled",
                cargoLockSha256,
                licenseInventory: "licenses.json",
              },
            }, null, 2)}\n`,
          );
          NODE

      - name: Smoke worker and enforce compressed budget
        shell: bash
        run: |
          set -euo pipefail
          BINARY=".scaffold/rust-candidate/${{ matrix.target }}/synthesis-sidecar${{ startsWith(matrix.target, 'win32-') && '.exe' || '' }}"
          npx tsx scripts/smoke-synthesis-rust-sidecar-worker.ts \
            "${BINARY}" \
            ".scaffold/rust-candidate/${{ matrix.target }}/provenance.json"
          npx tsx scripts/smoke-synthesis-rust-durable-candidate.ts "${BINARY}"
          tar -czf ".scaffold/synthesis-rust-sidecar-${{ matrix.target }}.tar.gz" \
            -C .scaffold/rust-candidate "${{ matrix.target }}"
          node - ".scaffold/synthesis-rust-sidecar-${{ matrix.target }}.tar.gz" <<'NODE'
          const fs = require("fs");
          const bytes = fs.statSync(process.argv[2]).size;
          if (bytes > 15 * 1024 * 1024) {
            throw new Error(`Compressed candidate exceeds 15 MiB: ${bytes}`);
          }
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: synthesis-rust-sidecar-${{ matrix.target }}
          path: .scaffold/synthesis-rust-sidecar-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  aggregate-budget:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: synthesis-rust-sidecar-*
          path: .scaffold/candidates
          merge-multiple: true
      - name: Enforce 75 MiB aggregate budget
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const files = fs.readdirSync(".scaffold/candidates")
            .filter((name) => name.endsWith(".tar.gz"));
          if (files.length !== 5) throw new Error(`Expected five candidates, found ${files.length}`);
          const bytes = files.reduce(
            (total, name) => total + fs.statSync(path.join(".scaffold/candidates", name)).size,
            0,
          );
          if (bytes > 75 * 1024 * 1024) {
            throw new Error(`Candidates exceed 75 MiB aggregate: ${bytes}`);
          }
          NODE
