name: Build Synthesis Rust Sidecar Candidates

on:
  workflow_dispatch:
  push:
    branches:
      - dev-refactor
    paths:
      - "native/synthesis-sidecar/**"
      - "packages/synthesis-contracts/contract-set/synthesis-cross-language-v1/**"
      - "scripts/synthesis-sidecar-runtime-release-governance.ts"
      - ".github/workflows/build-synthesis-rust-sidecar.yml"

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
          - target: darwin-x64
            os: macos-13
          - target: darwin-arm64
            os: macos-14
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@1.92.0

      - name: Build candidate
        shell: bash
        run: |
          set -euo pipefail
          RUST_FINGERPRINT="$(npx tsx -e 'import { computeSynthesisRustSidecarSourceFingerprint } from "./scripts/synthesis-sidecar-runtime-release-governance.ts"; computeSynthesisRustSidecarSourceFingerprint().then((value) => process.stdout.write(value.fingerprint))')"
          SYNTHESIS_RUST_BUILD_FINGERPRINT="${RUST_FINGERPRINT}" \
            cargo +1.92.0 build --release --locked \
              --manifest-path native/synthesis-sidecar/Cargo.toml \
              --bin synthesis-sidecar
          mkdir -p ".scaffold/rust-candidate/${{ matrix.target }}"
          cp "native/synthesis-sidecar/target/release/synthesis-sidecar${{ startsWith(matrix.target, 'win32-') && '.exe' || '' }}" \
            ".scaffold/rust-candidate/${{ matrix.target }}/synthesis-sidecar${{ startsWith(matrix.target, 'win32-') && '.exe' || '' }}"
          cp native/synthesis-sidecar/licenses.json \
            ".scaffold/rust-candidate/${{ matrix.target }}/licenses.json"
          node - "${RUST_FINGERPRINT}" "${{ matrix.target }}" <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(
            `.scaffold/rust-candidate/${process.argv[3]}/provenance.json`,
            `${JSON.stringify({
              schema: "synthesis-rust-sidecar-provenance.v1",
              target: process.argv[3],
              sourceFingerprint: process.argv[2],
              toolchain: "1.92.0",
            }, null, 2)}\n`,
          );
          NODE

      - name: Smoke worker and enforce compressed budget
        shell: bash
        run: |
          set -euo pipefail
          BINARY=".scaffold/rust-candidate/${{ matrix.target }}/synthesis-sidecar${{ startsWith(matrix.target, 'win32-') && '.exe' || '' }}"
          node - "${BINARY}" <<'NODE'
          const { spawnSync } = require("child_process");
          const fs = require("fs");
          const binary = process.argv[2];
          const provenance = JSON.parse(fs.readFileSync(
            `.scaffold/rust-candidate/${{ matrix.target }}/provenance.json`,
            "utf8",
          ));
          const payload = {
            protocol: "synthesis-rust-worker.v1",
            type: "run",
            taskId: "smoke:1",
            operation: "citation_graph_metrics.v1",
            payload: {
              graphHash: `sha256:${"0".repeat(64)}`,
              nodes: [{
                nodeId: "paper:1",
                kind: "library_paper",
                libraryId: 1,
                itemKey: "1",
                title: "Smoke",
                year: "2024",
              }],
              edges: [],
            },
          };
          const run = spawnSync(binary, ["worker"], {
            input: `${JSON.stringify(payload)}\n`,
            encoding: "utf8",
          });
          if (run.status !== 0) throw new Error(run.stderr);
          const frames = run.stdout.trim().split(/\r?\n/).map(JSON.parse);
          if (
            frames[0]?.type !== "ready" ||
            frames[0]?.buildFingerprint !== provenance.sourceFingerprint ||
            frames[1]?.type !== "result"
          ) {
            throw new Error(`Unexpected worker frames: ${run.stdout}`);
          }
          NODE
          tar -czf ".scaffold/synthesis-rust-sidecar-${{ matrix.target }}.tar.gz" \
            -C .scaffold/rust-candidate "${{ matrix.target }}"
          node - ".scaffold/synthesis-rust-sidecar-${{ matrix.target }}.tar.gz" <<'NODE'
          const fs = require("fs");
          const bytes = fs.statSync(process.argv[2]).size;
          if (bytes > 15 * 1024 * 1024) {
            throw new Error(`Compressed candidate exceeds 15 MiB: ${bytes}`);
          }
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: synthesis-rust-sidecar-${{ matrix.target }}
          path: .scaffold/synthesis-rust-sidecar-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  aggregate-budget:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: synthesis-rust-sidecar-*
          path: .scaffold/candidates
          merge-multiple: true
      - name: Enforce 75 MiB aggregate budget
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const files = fs.readdirSync(".scaffold/candidates")
            .filter((name) => name.endsWith(".tar.gz"));
          if (files.length !== 5) throw new Error(`Expected five candidates, found ${files.length}`);
          const bytes = files.reduce(
            (total, name) => total + fs.statSync(path.join(".scaffold/candidates", name)).size,
            0,
          );
          if (bytes > 75 * 1024 * 1024) {
            throw new Error(`Candidates exceed 75 MiB aggregate: ${bytes}`);
          }
          NODE
