[package]
name = "synthesis-application"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
parity-harness = ["synthesis-canonical-store/parity-harness"]

[[example]]
name = "checkpoint_bundle_webdav_debug_application_parity"
required-features = ["parity-harness"]

[[example]]
name = "typed_application_parity"
required-features = ["parity-harness"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
synthesis-repository = { path = "../synthesis-repository" }
synthesis-canonical-store = { path = "../synthesis-canonical-store" }
synthesis-protocol = { path = "../synthesis-protocol" }

[dev-dependencies]
synthesis-test-support = { path = "../synthesis-test-support" }
