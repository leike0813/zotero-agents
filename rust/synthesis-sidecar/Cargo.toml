[workspace]
members = [
  "crates/synthesis-test-support",
  "crates/synthesis-protocol",
  "crates/synthesis-metrics",
  "crates/synthesis-tag-vocabulary",
  "crates/synthesis-concept-kb",
  "crates/synthesis-topic-graph",
  "crates/synthesis-reference-matcher",
  "crates/synthesis-topic-structured-artifact",
  "crates/synthesis-citation-graph-build",
  "crates/synthesis-citation-layout",
  "crates/synthesis-repository",
  "crates/synthesis-canonical-store",
  "crates/synthesis-application",
  "crates/synthesis-sidecar",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
regress = { version = "=0.11.1", features = ["utf16"] }
unicode-normalization = "=0.1.24"
unicode_categories = "=0.1.1"
forceatlas2 = { version = "=0.8.0", default-features = false }
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled", "backup"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
