schema: hermes.profile.config.v2
profile: zotero-librarian
zoteroBridge:
  installScript: scripts/install_zotero_bridge_cli.py
  binaryDir: assets/zotero-bridge/bin
  hostProfileEnv: ZOTERO_BRIDGE_HOST_PROFILE
  hostHomeEnv: ZOTERO_BRIDGE_HOST_HOME
residentService:
  script: scripts/zotero_librarian_service.py
  stateDirEnv: ZOTERO_LIBRARIAN_STATE_DIR
  activeProfileEnv: ZOTERO_BRIDGE_PROFILE
  workspaceRoot: "$ZOTERO_LIBRARIAN_STATE_DIR/workspaces/<sha256>"
  workspaceLayout: connection-profile-v1
  defaultDatabase: "$HERMES_HOME/zotero-librarian/state.sqlite"
  receiptSchema: zotero-librarian.operation-receipt.v1
  cronSubmission: forbidden
