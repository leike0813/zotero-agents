html,
body {

  color: var(--zs-text);

button,
input,
textarea,
select {
  color-scheme: inherit;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--zs-accent);
  outline-offset: 2px;
}

::selection {
  background: var(--zs-selection-bg);
  color: var(--zs-selection-text);
}

::-moz-selection {
  background: var(--zs-selection-bg);
  color: var(--zs-selection-text);

/* Shared page-chrome layer for the Dashboard and Synthesis Workbench pages.
 *
 * Owns the cross-page design tokens (control colors, text/spacing scales) and
 * the shared layout patterns (panel header, scroll ownership utilities, empty
 * state, badge). Color/ radius/ shadow primitives come from theme.css; this
 * file never hardcodes raw colors outside the token definitions below.
 *
 * Scroll ownership model (both pages):
 *   L0 page root: never scrolls (overflow:hidden), grid carves out chrome.
 *   L1 chrome: sidebar nav may scroll internally; topbar/statusbar never do.
 *   L2 panel root: .zs-fill-col — column flex, overflow:hidden, min-height:0;
 *     fixed zones (panel header, toolbars, filter rows, pagination) never
 *     scroll with content.
 *   L3 primary scroll region: exactly one primary content scroll region per
 *     panel (flex:1; min-height:0; overflow:auto); sticky headers live inside
 *     it. Dashboard panels use the shared .zs-scroll-region utility;
 *     Synthesis surfaces keep their own wrappers (.concept-table-wrap,
 *     .tags-table-wrap) acting as the region under the same model. A table
 *     wrapper inside a panel region flattens (max-height:none) so it scrolls
 *     with the region instead of nesting a second scrollbar; only wrappers
 *     that are their own scroll containers live outside a region.
 *   L4 bounded secondary areas: sub-panels such as the concept review panel
 *     (max-height:42%) or the tag import popover (max-height:45%) may keep
 *     their own bounded scrolling but never carry primary content; drawer/
 *     popover/dialog bodies and the Sigma canvas manage their own scrolling.
 */

:root {
  --zs-control-bg: #dbeafe;
  --zs-control-hover: #c7dcff;
  --zs-control-active-bg: #bfdbfe;
  --zs-control-border: #8fb3f4;
  --zs-control-disabled-bg: #edf1f6;
  --zs-control-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);

  --zs-text-xs: 11px;
  --zs-text-sm: 12px;
  --zs-text-md: 13px;
  --zs-text-lg: 15px;

  --zs-space-1: 4px;
  --zs-space-2: 8px;
  --zs-space-3: 12px;
  --zs-space-4: 16px;
  --zs-space-5: 24px;
  --zs-space-6: 32px;

  --zs-badge-accent-bg: var(--zs-accent-soft);
  --zs-badge-accent-border: var(--zs-accent-soft-border);
  --zs-badge-accent-text: var(--zs-accent-strong);
  --zs-badge-success-bg: var(--zs-success-soft);
  --zs-badge-success-border: var(--zs-success-border);
  --zs-badge-success-text: var(--zs-success);
  --zs-badge-warning-bg: var(--zs-warning-soft);
  --zs-badge-warning-border: var(--zs-warning-border);
  --zs-badge-warning-text: var(--zs-warning);
  --zs-badge-danger-bg: var(--zs-danger-soft);
  --zs-badge-danger-border: var(--zs-danger-border);
  --zs-badge-danger-text: var(--zs-danger);
  --zs-badge-muted-bg: var(--zs-panel-alt);
  --zs-badge-muted-border: var(--zs-border);
  --zs-badge-muted-text: var(--zs-muted);
}

:root[data-zs-theme="dark"] {
  --zs-control-bg: rgba(96, 165, 250, 0.14);
  --zs-control-hover: rgba(96, 165, 250, 0.22);
  --zs-control-active-bg: rgba(96, 165, 250, 0.28);
  --zs-control-border: rgba(147, 197, 253, 0.38);
  --zs-control-disabled-bg: #17212f;
  --zs-control-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-zs-theme="light"]) {
    --zs-control-bg: rgba(96, 165, 250, 0.14);
    --zs-control-hover: rgba(96, 165, 250, 0.22);
    --zs-control-active-bg: rgba(96, 165, 250, 0.28);
    --zs-control-border: rgba(147, 197, 253, 0.38);
    --zs-control-disabled-bg: #17212f;
    --zs-control-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
  }
}

/* Panel header: fixed zone at the top of a panel. Title/subtitle on the
 * left, an optional back entry first, actions flushed right. */
.zs-panel-header {
  display: flex;
  align-items: center;
  gap: var(--zs-space-3);
  flex: none;
  min-width: 0;
}

.zs-panel-header-main {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.zs-panel-header-title {
  margin: 0;
  font-size: var(--zs-text-lg);
  font-weight: 600;
  line-height: 1.3;
  color: var(--zs-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.zs-panel-header-subtitle {
  font-size: var(--zs-text-sm);
  color: var(--zs-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.zs-panel-header-actions {
  margin-inline-start: auto;
  display: flex;
  align-items: center;
  gap: var(--zs-space-2);
  flex: none;
}

/* Back entry for secondary views (detail pages, document pages). Always the
 * first element of the panel header, visually distinct from action buttons. */
.zs-back-link {
  appearance: none;
  -moz-appearance: none;
  display: inline-flex;
  align-items: center;
  gap: var(--zs-space-1);
  flex: none;
  border: 1px solid transparent;
  border-radius: var(--zs-radius-md);
  background: transparent;
  color: var(--zs-accent);
  font: inherit;
  font-size: var(--zs-text-md);
  padding: 4px 8px;
  margin-inline-start: -8px;
  cursor: pointer;
}

.zs-back-link:hover {
  background: var(--zs-surface-hover);
}

.zs-back-link .zs-icon {
  flex: none;
}

/* Scroll ownership utilities — see the model description at the top. */
.zs-fill-col {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  overflow: hidden;
}

.zs-scroll-region {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
}

.zs-panel-fixed {
  flex: none;
}

/* Empty state: icon + one-line explanation + optional guidance action. */
.zs-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--zs-space-2);
  padding: var(--zs-space-6);
  color: var(--zs-muted);
  font-size: var(--zs-text-md);
  text-align: center;
}

/* Badge: pill with semantic soft background/border/text. Modifiers:
 * .zs-badge--accent | --success | --warning | --danger | --muted. */
.zs-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--zs-space-1);
  padding: 1px 8px;
  border-radius: var(--zs-radius-pill);
  border: 1px solid var(--zs-badge-muted-border);
  background: var(--zs-badge-muted-bg);
  color: var(--zs-badge-muted-text);
  font-size: var(--zs-text-xs);
  line-height: 1.6;
  white-space: nowrap;
}

.zs-badge--accent {
  background: var(--zs-badge-accent-bg);
  border-color: var(--zs-badge-accent-border);
  color: var(--zs-badge-accent-text);
}

.zs-badge--success {
  background: var(--zs-badge-success-bg);
  border-color: var(--zs-badge-success-border);
  color: var(--zs-badge-success-text);
}

.zs-badge--warning {
  background: var(--zs-badge-warning-bg);
  border-color: var(--zs-badge-warning-border);
  color: var(--zs-badge-warning-text);
}

.zs-badge--danger {
  background: var(--zs-badge-danger-bg);
  border-color: var(--zs-badge-danger-border);
  color: var(--zs-badge-danger-text);
}

/* Status dot for environment indicators (e.g. the sidecar pill). */
.zs-status-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: none;
  background: var(--zs-muted-soft);
}

.zs-status-dot--ok {
  background: var(--zs-success);
}

.zs-status-dot--warn {
  background: var(--zs-warning);
}

.zs-status-dot--error {
  background: var(--zs-danger);
}

/* Square icon-only button shared by Dashboard and Synthesis chrome. */
.zs-icon-btn {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  min-height: 26px;
  padding: 0;
}

/* Throwaway layout experiments. Color and control tokens come from shared CSS. */
* {
  box-sizing: border-box;
}

  margin: 0;
  font: 13px/1.55 var(--zs-font-sans);
}

.window {
  max-width: 1180px;

  margin: 0 auto;

  overflow: hidden;
  box-shadow: var(--zs-shadow-soft);
  display: grid;
  grid-template-rows: 38px minmax(0, 1fr) 34px;

}
.window.compact {
  height: 600px;
  max-width: 900px;
}
.window-titlebar {

  display: grid;
  grid-template-columns: 188px minmax(0, 1fr);
  min-height: 0;
  overflow: hidden;
}
.sidebar {
  border-right: 1px solid var(--zs-border);
  background: var(--zs-panel-alt);

  padding: 20px 12px;

  flex-direction: column;

  text-align: left;
  padding: 8px 10px;
  border-radius: var(--zs-radius-sm);

.nav.active {
  color: var(--zs-accent-strong);
  background: var(--zs-surface-selected);
  font-weight: 600;
}
.nav:hover {
  background: var(--zs-surface-hover);
}
.nav .number {
  margin-left: auto;
  color: var(--zs-muted);
  font-size: 11px;
}
.sidebar-foot {
  margin-top: auto;
  padding: 24px 10px 0;
  font-size: 11px;
  color: var(--zs-muted);
}
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.page-header {
  padding: 23px 28px 19px;
  border-bottom: 1px solid var(--zs-border);
  flex: none;
}
.page-header p {
  margin-top: 4px;
  color: var(--zs-muted);
  font-size: 12px;
}
.page-content {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 24px 28px;
}
.page-actions {
  flex: none;
  border-top: 1px solid var(--zs-border);
  padding: 10px 28px;
  background: var(--zs-panel);
}
.window-status {
  padding: 7px 14px;
  border-top: 1px solid var(--zs-border);
  font-size: 11px;
  background: var(--zs-panel-alt);
  color: var(--zs-muted);
}
.empty {
  text-align: center;
  padding: 50px 16px;
  max-width: 590px;
  margin: auto;
}
.empty-symbol {
  width: 56px;
  height: 56px;
  margin: 0 auto 18px;
  border: 1px solid var(--zs-accent-soft-border);
  border-radius: 15px;
  background: var(--zs-accent-soft);
  color: var(--zs-accent);
  display: grid;
  place-items: center;
  font-size: 24px;
}
.empty h2 {
  margin-bottom: 9px;
}
.empty p {
  color: var(--zs-muted);
  margin-bottom: 22px;
}
.empty .row {
  justify-content: center;
}
.card {
  border: 1px solid var(--zs-border);
  background: var(--zs-panel);
  border-radius: var(--zs-radius-md);
  padding: 17px 18px;
  min-width: 0;
}
.card.clickable:hover {
  border-color: var(--zs-accent-soft-border);
  background: var(--zs-panel-alt);
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.connection-card {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.connection-card .actions {
  padding-top: 13px;
  border-top: 1px solid var(--zs-border);
  margin-top: auto;
}
.brand-icon {
  width: 36px;
  height: 36px;
  border: 1px solid var(--zs-border);
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: var(--zs-text-soft);
  flex: none;
  font-weight: 600;
  font-size: 13px;
  background: var(--zs-panel-alt);
}
.connection-meta {
  display: grid;
  gap: 3px;
  min-width: 0;
}
.connection-meta p {
  font-size: 12px;
  color: var(--zs-muted);
  overflow-wrap: anywhere;
}
.section-intro {
  font-size: 12px;
  color: var(--zs-muted);
  padding-top: 4px;
}
.banner {
  border: 1px solid var(--zs-border);
  background: var(--zs-panel-alt);
  padding: 12px 14px;
  border-radius: var(--zs-radius-sm);
  font-size: 12px;
}
.banner.warning {
  color: var(--zs-warning);
  border-color: var(--zs-warning-border);
  background: var(--zs-warning-soft);
}
.banner.success {
  color: var(--zs-success);
  border-color: var(--zs-success-border);
  background: var(--zs-success-soft);
}
.banner.error {
  color: var(--zs-danger);
  border-color: var(--zs-danger-border);
  background: var(--zs-danger-soft);
}
.banner p {
  margin-top: 3px;
}
.master-detail {
  display: grid;
  grid-template-columns: 245px minmax(0, 1fr);
  min-height: 0;
  flex: 1;
  overflow: hidden;
}
.connection-list {
  min-height: 0;
  overflow: auto;
  background: var(--zs-panel-alt);
  border-right: 1px solid var(--zs-border);
  padding: 12px;
}
.connection-row {
  display: flex;
  gap: 10px;
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  background: transparent;
  padding: 12px 9px;
  border-radius: 7px;
  color: var(--zs-text);
  margin-bottom: 5px;
}
.connection-row.selected {
  border-color: var(--zs-accent-soft-border);
  background: var(--zs-panel);
}
.connection-row small {
  display: block;
  color: var(--zs-muted);
}
.detail-content {
  padding: 24px;
  min-height: 0;
  overflow: auto;
}
.detail-line {
  padding: 12px 0;
  border-bottom: 1px solid var(--zs-border);
  font-size: 12px;
}
.detail-line .muted {
  min-width: 96px;
}
.model-list {
  border: 1px solid var(--zs-border);
  border-radius: var(--zs-radius-sm);
  overflow: hidden;
}
.model-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 13px;
  border-bottom: 1px solid var(--zs-border);
  font-size: 12px;
}
.model-row:last-child {
  border-bottom: 0;
}
.model-row small {
  color: var(--zs-muted);
  display: block;
}
.hero {
  border-left: 3px solid var(--zs-accent);
  padding: 7px 0 7px 20px;
  margin-bottom: 24px;
}
.hero h2 {
  font-size: 22px;
  margin-bottom: 6px;
}
.steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin: 20px 0;
  gap: 12px;
}
.step {
  color: var(--zs-muted);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
.step span {
  border: 1px solid var(--zs-border-strong);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: none;
}
.step.complete {
  color: var(--zs-success);
}
.step.current {
  color: var(--zs-accent);
  font-weight: 600;
}
.setup-choice {
  width: 100%;
  text-align: left;
  padding: 16px;
  display: flex;
  gap: 14px;
  align-items: center;
  border: 1px solid var(--zs-border);
  border-radius: 8px;
  background: var(--zs-panel);
  color: var(--zs-text);
}
.setup-choice:hover {
  border-color: var(--zs-accent);
}
.setup-choice small {
  color: var(--zs-muted);
  display: block;
  margin-top: 3px;
}
.overview-task {
  padding: 16px 0;
  border-bottom: 1px solid var(--zs-border);
}
.overview-task:last-child {
  border: 0;
}
.field {
  display: grid;
  gap: 5px;
  position: relative;
  font-size: 12px;
  min-width: 0;
}
.field input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--zs-border-strong);
  background: var(--zs-input-bg);
  color: var(--zs-text);
  border-radius: 6px;
}
.field small {
  color: var(--zs-muted);
}
.field-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.choice {
  position: relative;
  min-width: 0;
}
.choice-trigger {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  gap: 10px;
  text-align: left;
}
.choice-trigger span:first-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.choice-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  min-width: 100%;
  max-height: 205px;
  overflow: auto;
  z-index: 12;
  border: 1px solid var(--zs-border-strong);
  border-radius: 6px;
  padding: 4px;
  background: var(--zs-panel);
  box-shadow: var(--zs-shadow-soft);
}
.choice-menu button {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  color: var(--zs-text);
  padding: 7px 10px;
  white-space: nowrap;
  border-radius: 4px;
}
.choice-menu button:hover {
  background: var(--zs-surface-selected);
}
.choice-menu button[aria-selected="true"] {
  background: var(--zs-accent-soft);
  color: var(--zs-accent-strong);
}
.default-block {
  padding: 19px 0;
  border-bottom: 1px solid var(--zs-border);
}
.default-block:first-child {
  padding-top: 0;
}
.default-block:last-child {
  border-bottom: 0;
}
.default-block .field-grid {
  margin-top: 13px;
}
.default-block h3 {
  font-size: 13px;
}
.switch-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
}
.tab-row {
  display: flex;
  gap: 6px;
  margin-bottom: 18px;
}
.tab-row .active {
  background: var(--zs-accent-soft);
  color: var(--zs-accent-strong);
  border-color: var(--zs-accent-soft-border);
}
.source-row {
  border-top: 1px solid var(--zs-border);
  padding: 14px 0;
}
.source-row:first-child {
  border-top: 0;
}
.modal-overlay {
  position: absolute;
  inset: 38px 0 34px;
  background: var(--zs-overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
  padding: 18px;
}
.modal {
  display: flex;
  flex-direction: column;
  width: 570px;
  max-width: 100%;
  max-height: 100%;
  border: 1px solid var(--zs-border-strong);
  border-radius: 10px;
  background: var(--zs-panel);
  box-shadow: var(--zs-shadow-strong);
  overflow: hidden;
}
.modal.wide {
  width: 690px;
}
.modal-header {
  padding: 17px 20px;
  border-bottom: 1px solid var(--zs-border);
  flex: none;
}
.modal-body {
  padding: 20px;
  min-height: 0;
  overflow: auto;
}
.modal-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--zs-border);
  flex: none;
}
.account-block {
  padding: 14px;
  border: 1px solid var(--zs-border);
  border-radius: 7px;
  background: var(--zs-panel-alt);
}
.auth-progress {
  display: flex;
  align-items: center;
  gap: 9px;
}
.spinner {
  width: 14px;
  height: 14px;
  border: 2px solid var(--zs-border);
  border-top-color: var(--zs-accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.modal-footer .muted {
  margin-right: auto;
  font-size: 11px;
}
.variant-switcher {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  padding: 7px;
  border-radius: 30px;
  background: var(--zs-text);
  color: var(--zs-panel);
  box-shadow: var(--zs-shadow-strong);
  display: flex;
  align-items: center;
  gap: 5px;
  z-index: 50;
}
.variant-switcher button {
  border: 0;
  background: transparent;
  color: inherit;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  white-space: nowrap;
}
.variant-switcher button.active {
  background: var(--zs-panel);
  color: var(--zs-text);
}
.review-state {
  max-width: 1180px;
  margin: 12px auto 0;
  font-size: 11px;
  color: var(--zs-muted);
}
.review-state pre {
  white-space: pre-wrap;
  word-break: break-word;
  padding: 12px;
  border: 1px solid var(--zs-border);
  background: var(--zs-panel);
  max-height: 240px;
  overflow: auto;
}
.closed-window {
  margin: 0 auto;
  max-width: 1180px;
  padding: 100px 20px;
  text-align: center;
  border: 1px dashed var(--zs-border-strong);
}
@media (max-width: 1020px) {
  .prototype-page {
    padding: 14px 12px 80px;
  }
  .window-layout {
    grid-template-columns: 160px minmax(0, 1fr);
  }
  .page-content,
  .page-header {
    padding: 18px;
  }
  .master-detail {
    grid-template-columns: 205px minmax(0, 1fr);
  }
  .detail-content {
    padding: 18px;
  }
}
@media (max-width: 760px) {
  .card-grid,
  .field-grid {
    grid-template-columns: 1fr;
  }
  .master-detail {
    grid-template-columns: 165px minmax(0, 1fr);
  }
  .window-layout {
    grid-template-columns: 135px minmax(0, 1fr);
  }
  .sidebar {
    padding: 16px 7px;
  }
  .nav {
    padding: 8px;
  }
  .variant-switcher button {
    padding: 5px 8px;
  }
  .page-header .row {
    flex-wrap: wrap;
  }
}
